<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>要確認台帳 | HD Origin</title>
  <link rel="stylesheet" href="/ledgers/reports/needs-review-ledger-report.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">HD ORIGIN LEDGER</p>
      <h1>要確認台帳</h1>
      <p class="page-description">
        専門解析で要確認となった証憑を確認します。
      </p>
    </div>

    <nav class="header-actions">
      <a class="button secondary"
         href="/payables/payment-document-specialist-needs-review.html">
        専門解析へ
      </a>

      <a class="button secondary"
         href="/ledgers/ledger-management-dashboard.html">
        台帳・管理へ
      </a>

      <button type="button"
              class="button primary"
              id="reloadButton">
        再読込
      </button>
    </nav>
  </header>

  <main>
    <section class="summary-grid">
      <article class="summary-card">
        <span>登録件数</span>
        <strong id="recordCount">0</strong>
      </article>

      <article class="summary-card">
        <span>照合済み</span>
        <strong id="confirmedCount">0</strong>
      </article>

      <article class="summary-card">
        <span>未照合・要確認</span>
        <strong id="pendingCount">0</strong>
      </article>
    </section>

    <section class="ledger-panel">
      <div class="ledger-heading">
        <div>
          <h2>照合対象一覧</h2>
          <p id="ledgerStatus">
            登録済みデータを確認しています。
          </p>
        </div>

        <label class="search-box">
          <span>検索</span>
          <input type="search"
                 id="ledgerSearch"
                 placeholder="会社・取引先・番号・照合内容">
        </label>
      </div>

      <div class="table-wrap">
        <table class="ledger-table">
          <thead>
            <tr>
              <th>管理番号</th>
              <th>会社</th>
              <th>書類区分</th>
              <th>発行元・取引先</th>
              <th>対象日</th>
              <th class="amount-column">金額</th>
              <th>確認状態</th>
              <th>確認内容</th>
              <th class="action-column">明細</th>
              <th class="action-column">その他</th>
              <th class="action-column">編集</th>
            </tr>
          </thead>

          <tbody id="ledgerBody">
            <tr class="empty-row">
              <td colspan="11">
                登録済みデータはありません。
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal-backdrop"
       id="otherModal"
       hidden>
    <section class="modal-card"
             role="dialog"
             aria-modal="true"
             aria-labelledby="otherModalTitle">
      <div class="modal-header">
        <h2 id="otherModalTitle">その他情報</h2>

        <button type="button"
                class="modal-close"
                id="otherModalClose"
                aria-label="閉じる">
          ×
        </button>
      </div>

      <div class="modal-body"
           id="otherModalBody">
      </div>
    </section>
  </div>

  <script src="/ledgers/reports/needs-review-ledger-report.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>支払書類仕分けシステム - HD Origin Project</title>
  <link rel="stylesheet" href="./payment-document-review.css">


  <!-- HD_ORIGIN_HIDE_PAYMENT_DESTINATION_DISPLAY_GPT2_20260712_START -->
  <style>
    /*
     * payment_destinationは保存・内部処理用として保持する。
     * 人間向け画面には表示しない。
     */

    label:has(#analysisAiDestination),
    label:has(#analysisDestination) {
      display: none !important;
    }

    .visual-dest {
      display: none !important;
    }

    .sorting-detail-grid > div:has(.visual-dest) {
      display: none !important;
    }
  </style>
  <!-- HD_ORIGIN_HIDE_PAYMENT_DESTINATION_DISPLAY_GPT2_20260712_END -->
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>支払書類仕分けシステム</h1>
      <button type="button" onclick="location.href='./payment-document-inbox.html'">OCR取込へ戻る</button>
      <button type="button" onclick="location.href='/payables/payable-list.html'">請求書・未払管理へ</button>
      <button type="button" onclick="location.href='/'">メインページ</button>
      <button type="button" class="warn" onclick="restartServer()">サーバー再起動</button>
            <!-- HD_ORIGIN_PAYMENT_DOCUMENT_SPECIALIST_HEADER_BUTTONS_20260708_START -->
            <nav class="specialist-system-nav"
           aria-label="専門解析システム"
           style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.75rem;">
        <button type="button"
                class="specialist-system-button specialist-invoice"
                data-analysis-system-code="invoice_payable_analysis"
                data-base-label="請求・未払系"
                onclick="location.href='./payment-document-specialist-invoice-payable.html'">請求・未払系（0）</button>
        <button type="button"
                class="specialist-system-button specialist-receipt"
                data-analysis-system-code="receipt_evidence_analysis"
                data-base-label="レシート・領収書"
                onclick="location.href='/receipts/receipt-list.html'">レシート・領収書（0）</button>
        <button type="button"
                class="specialist-system-button specialist-tax"
                data-analysis-system-code="tax_public_analysis"
                data-base-label="税金・公的支払"
                onclick="location.href='./payment-document-specialist-tax-public.html'">税金・公的支払（0）</button>
        <button type="button"
                class="specialist-system-button specialist-contract"
                data-analysis-system-code="contract_insurance_lease_analysis"
                data-base-label="契約・保険・リース"
                onclick="location.href='./payment-document-specialist-contract-insurance-lease.html'">契約・保険・リース（0）</button>
        <button type="button"
                class="specialist-system-button specialist-utility"
                data-analysis-system-code="utility_communication_analysis"
                data-base-label="公共料金・通信費"
                onclick="location.href='./payment-document-specialist-utility-communication.html'">公共料金・通信費（0）</button>
        <button type="button"
                class="specialist-system-button specialist-card"
                data-analysis-system-code="card_statement_analysis"
                data-base-label="カード明細"
                onclick="location.href='./payment-document-specialist-card-statement.html'">カード明細（0）</button>
        <button type="button"
                class="specialist-system-button specialist-reference"
                data-analysis-system-code="delivery_note_analysis"
                data-base-label="納品書・照合"
                onclick="location.href='./payment-document-specialist-reference-check.html'">納品書・照合（0）</button>
        <button type="button"
                class="specialist-system-button specialist-bank-transaction"
                data-analysis-system-code="bank_transaction_analysis"
                data-base-label="銀行取引"
                onclick="location.href='./payment-document-specialist-bank-transaction.html'">銀行取引（0）</button>        <button type="button"
                class="specialist-system-button specialist-needs-review"
                data-analysis-system-code="needs_review_analysis"
                data-base-label="要確認"
                onclick="location.href='./payment-document-specialist-needs-review.html'" style="background-color:#ffc107;color:#000;">要確認（0）</button>
      </nav>
      <!-- HD_ORIGIN_PAYMENT_DOCUMENT_SPECIALIST_HEADER_BUTTONS_20260708_END -->
<span class="muted">OCR済み書類をAI候補と人間判断で仕分ける画面です。</span>
    </header>

    <section class="panel list-panel">
      <div class="panel-title">
        <span>仕分け対象書類</span>
        <button type="button" class="light" onclick="loadItems()">更新</button>
      </div>
            <div class="sorting-bulk-row" style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin:0.5rem 0;">
        <button type="button" class="light" onclick="selectAllSortingItems()">全選択</button>
        <button type="button" class="light" onclick="clearSortingSelection()">全解除</button>
        <button type="button" class="action-btn action-ai sorting-bulk-analyze" onclick="runSelectedAnalyses()">まとめて仕分け</button>
        <button type="button" id="bulkSpecialistRoutingButton" class="action-btn sorting-bulk-route" onclick="runSelectedSpecialistRouting()">まとめて振り分け</button>
</div>
      <div id="selectedSortingSummary" class="selected-summary">選択: 0件</div>
      <div id="sortingColorLegend" class="sorting-color-legend">
        <span class="legend-chip legend-invoice">請求・未払系</span>
        <span class="legend-chip legend-expense">レシート・領収書</span>
        <span class="legend-chip legend-tax">税金・公的支払</span>
        <span class="legend-chip legend-contract">契約・保険・リース</span>
        <span class="legend-chip legend-utility">公共料金・通信費</span>
        <span class="legend-chip legend-card">カード</span>
        <span class="legend-chip legend-reference">納品書・照合</span>
        <span class="legend-chip legend-review">要確認</span>
      </div>

<div id="summary" class="summary">読込中...</div>
      <div id="list" class="list"></div>
    </section>

    <section class="panel preview-panel">
      <div class="panel-title preview-title">
        <span>原本画像プレビュー</span>
        <div class="preview-rotate-buttons" aria-label="原本画像回転">
          <button type="button" onclick="rotateDocumentPreview(-90)">左回転</button>
          <button type="button" onclick="rotateDocumentPreview(90)">右回転</button>
          <button type="button" onclick="resetDocumentPreviewRotation()">戻す</button>
        </div>
      </div>
      <div id="documentPreview" class="document-preview">
        左からDB保存済みOCRを選択してください。
      </div>
    </section>

    <section class="panel analysis-panel">
      <div class="panel-title">
        <span>AI候補・仕分け確認</span>
        <div class="record-navigation">
          <button type="button"
                  class="light record-navigation-button"
                  id="previousRecordButton"
                  onclick="moveSelectedRecord(-1)"
                  aria-label="前のレコード"
                  title="前のレコード">◀</button>
          <span class="record-navigation-position" id="recordNavigationPosition">0 / 0</span>
          <button type="button"
                  class="light record-navigation-button"
                  id="nextRecordButton"
                  onclick="moveSelectedRecord(1)"
                  aria-label="次のレコード"
                  title="次のレコード">▶</button>
          <button type="button" class="light mini-memo-button" id="visibleFieldsMemoButton">表示</button>
        </div>
      </div>

            <div class="analysis-form-scroll">
        <!-- HD_ORIGIN_BASIC_ANALYSIS_LAYOUT_20260711_START -->
        <section class="analysis-section stage1-sorting-block">
          <div class="analysis-section-title">基礎解析</div>
          <div class="form-grid">
            <label>
              会計区分
              <select class="analysis-field master-select"
                      id="analysisAccountingCategory"
                      data-master-type="accounting_categories"
                      data-master-label="会計区分">
                <option value="">マスタ読込中...</option>
              </select>
            </label>

            <label>
              取込媒体
              <select class="analysis-field master-select"
                      id="analysisPaymentSourceType"
                      data-master-type="payment_source_types"
                      data-master-label="取込媒体">
                <option value="">マスタ読込中.</option>
              </select>
            </label>

            <label hidden aria-hidden="true" data-internal-field="payment-destination">
              処理先
              <select class="analysis-field master-select"
                      id="analysisAiDestination"
                      data-master-type="payment_destinations"
                      data-master-label="処理先">
                <option value="">マスタ読込中...</option>
              </select>
            </label>

            <label>
              専門解析先
              <select class="analysis-field master-select"
                      id="analysisAnalysisSystemLabel"
                      data-master-type="analysis_systems"
                      data-master-label="専門解析先">
                <option value="">マスタ読込中.</option>
              </select>
              <input class="analysis-field"
                     type="hidden"
                     id="analysisAnalysisSystemCode">
              <input class="analysis-field"
                     type="hidden"
                     id="analysisAnalysisSystemReason">
              <input class="analysis-field"
                     type="hidden"
                     id="analysisAnalysisSystemConfidence">
            </label>

            <label>
              発行日
              <input class="analysis-field"
                     id="analysisIssueDate"
                     placeholder="例：2026-07-01">
            </label>

            <label>
              信頼度
              <input class="analysis-field"
                     id="analysisAiConfidence"
                     placeholder="例：高 / 中 / 低">
            </label>

            <label class="span2">
              理由
              <textarea class="analysis-field small-textarea"
                        id="analysisAiReason"
                        placeholder="会計区分・専門解析先・発行日を判断した理由"></textarea>
            </label>
          </div>
        </section>
        <!-- HD_ORIGIN_BASIC_ANALYSIS_LAYOUT_20260711_END -->

        <section class="analysis-section">
          <div class="analysis-section-title">基本情報</div>
          <div class="form-grid">
                        <label>
              証憑区分
              <select class="analysis-field master-select" id="analysisEvidenceType" data-master-type="evidence_types" data-master-label="証憑区分"><option value="">マスタ読込中...</option></select>
            </label>
            <label>
              書類名
              <input class="analysis-field" id="analysisDocumentTitle" placeholder="例：法人市民税納付書">
            </label>
                          <label>
                書類番号
                <input class="analysis-field" id="analysisDocumentNumber">
              </label>
              <label>
                参照番号
                <input class="analysis-field" id="analysisReferenceNumber">
              </label>
              <label>
                発行元郵便番号
                <input class="analysis-field" id="analysisIssuerPostalCode">
              </label>
<label>
              発行元
              <input class="analysis-field" id="analysisIssuer" placeholder="例：大阪市あべの市税事務所">
            </label>
            <label>
              支払先
              <input class="analysis-field" id="analysisVendorName" placeholder="例：株式会社〇〇">
            </label>
            <label>
              宛名
              <input class="analysis-field" id="analysisRecipient" placeholder="例：株式会社HDオリジンスタイル / 坂口 喜康">
            </label>
              <label>
                宛先コード
                <input class="analysis-field" id="analysisRecipientCode">
              </label>
            <label>
              会社名
              <input class="analysis-field" id="analysisCompanyName" placeholder="例：株式会社HDオリジンスタイル">
            </label>
            <label>
              個人名
              <input class="analysis-field" id="analysisPersonName" placeholder="例：坂口 喜康">
            </label>
            <label>
              部署名
              <input class="analysis-field" id="analysisDepartmentName" placeholder="例：経理部 / 総務">
            </label>
            <label>
              担当者名
              <input class="analysis-field" id="analysisContactName" placeholder="例：山田 太郎">
            </label>
            <label class="span2">
              住所
              <input class="analysis-field" id="analysisAddress" placeholder="例：大阪市...">
            </label>
            <label>
              電話番号
              <input class="analysis-field" id="analysisPhone" placeholder="例：06-0000-0000">
            </label>
            <label>
              メール
              <input class="analysis-field" id="analysisEmail" placeholder="例：info@example.com">
            </label>
            <label class="span2">
              Webサイト
              <input class="analysis-field" id="analysisWebsite" placeholder="例：https://...">
            </label>
          </div>
        </section>

        <section class="analysis-section">
          <div class="analysis-section-title">番号・識別情報</div>
          <div class="form-grid">
            <label>
              請求書番号

            </label>
            <label>

              <input class="analysis-field" id="analysisReceiptNo" placeholder="例：R-0001">

            <label>

              <input class="analysis-field" id="analysisPaymentNo" placeholder="例：納付番号">
            </label>
            <label>
              通知書番号
              <input class="analysis-field" id="analysisNoticeNo" placeholder="例：通知番号">
            </label>
            <label>
              管理番号
              <input class="analysis-field" id="analysisManagementNo" placeholder="例：管理番号">
            </label>
            <label>
              お客様番号
              <input class="analysis-field" id="analysisCustomerNo" placeholder="例：お客様番号">
            </label>
            <label>
              契約番号
              <input class="analysis-field" id="analysisContractNo" placeholder="例：契約番号">

        <section class="analysis-section">
          <div class="analysis-section-title">日付・期限</div>
          <div class="form-grid">
            <label>
              書類日付
              <input class="analysis-field" id="analysisDocumentDate" placeholder="例：2026-07-01">
            </label>
            <label>
              請求日
              <input class="analysis-field" id="analysisBillingDate" placeholder="例：2026-07-01">
            </label>
            <label>
              取引日・利用日
              <input class="analysis-field" id="analysisTransactionDate" placeholder="例：2026-07-01">

            <label>

            </label>
            <label>

              <input class="analysis-field" id="analysisClosingDate" placeholder="例：2026-07-20">
            </label>
            <label>
              支払期限・納期限
              <input class="analysis-field" id="analysisDueDate" placeholder="例：2026-07-31">
            </label>
            <label>
              支払予定日
              <input class="analysis-field" id="analysisPaymentPlanDate" placeholder="例：2026-08-10">

            <label>

              <input class="analysis-field" id="analysisWithdrawalDate" placeholder="例：2026-08-27">

            <label>

            <label>

              <input class="analysis-field" id="analysisServicePeriodEnd" placeholder="例：2026-06-30">
            </label>
            <label>
              契約開始日
              <input class="analysis-field" id="analysisContractStartDate" placeholder="例：2026-04-01">
            </label>
            <label>
              契約終了日
              <input class="analysis-field" id="analysisContractEndDate" placeholder="例：2027-03-31">
            </label>
            <label>
              更新日
              <input class="analysis-field" id="analysisRenewalDate" placeholder="例：2027-04-01">
            </label>
          </div>
        </section>

        <section class="analysis-section">
          <div class="analysis-section-title">金額・税</div>
          <div class="form-grid">
            <label>
              請求・支払金額
              <input class="analysis-field" id="analysisAmount" placeholder="例：98,800">
            </label>
            <label>
              合計金額
              <input class="analysis-field" id="analysisTotalAmount" placeholder="例：98,800">
            </label>
            <label>
              税込金額
              <input class="analysis-field" id="analysisAmountInTax" placeholder="例：98,800">

            <label>

            <label>

            </label>
            <label>

            </label>
            <label>
              8%対象金額
              <input class="analysis-field" id="analysisAmount8" placeholder="例：10,000">
            </label>
            <label>
              8%消費税
              <input class="analysis-field" id="analysisTax8" placeholder="例：800">

            <label>

            <label>

            <label>
              手数料

            </label>
            <label>
              延滞金
              <input class="analysis-field" id="analysisLateFeeAmount" placeholder="例：0">
            </label>
            <label>
              値引・割引
              <input class="analysis-field" id="analysisDiscountAmount" placeholder="例：-1,000">
            </label>
            <label>
              前回残高
              <input class="analysis-field" id="analysisPreviousBalance" placeholder="例：0">

            <label>

          <div class="analysis-section-title">支払情報</div>

            <label>

            <label>

            </label>
            
            <label>

<script>
  let items = [];

  function esc(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatJapanDateTime(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    const parts = new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).formatToParts(date).reduce((acc, part) => {
      acc[part.type] = part.value;
      return acc;
    }, {});

    return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
  }

  function showResult(message) {
    const result = document.getElementById("result");
    if (!result) return;

    if (message && typeof message === "object") {
      result.textContent = JSON.stringify(message, null, 2);
      return;
    }

    result.textContent = message || "";
  }

  function hasOcr(item) {
    return !!(item.ocrRawText || item.ocrTextPreview || item.ocrStatus === "ocr_done");

/* PAYMENT_DOCUMENT_REVIEW_IMAGE_PREVIEW_20260707_START */
  function documentPreviewUrl(item) {
    if (!item) return "";

    if (item.imageUrl) {
      return item.imageUrl;
    }

    const id = item.paymentDocumentOcrImportId || item.payment_document_ocr_import_id || "";

    if (id) {
      return "/api/payment-documents/ocr-imports/file/" + encodeURIComponent(String(id));
    }

    const fileName = item.savedFileName || item.fileName || "";

    if (fileName) {
      return "/api/payment-documents/scan-inbox/file/" + encodeURIComponent(fileName);
    }

    return "";
  }

  function isPreviewImage(item, url) {
    const mime = String(item && item.mimeType || "").toLowerCase();

    if (mime.startsWith("image/")) {
      return true;
    }

    return /\.(png|jpg|jpeg|webp|gif)(\?|#|$)/i.test(String(url || ""));
  }

  function isPreviewPdf(item, url) {
    const mime = String(item && item.mimeType || "").toLowerCase();

    if (mime === "application/pdf") {
      return true;
    }

    return /\.pdf(\?|#|$)/i.test(String(url || ""));
  }

/* PAYMENT_DOCUMENT_REVIEW_PREVIEW_ROTATE_20260707_START */
  let documentPreviewRotation = 0;
/* PAYMENT_DOCUMENT_REVIEW_PREVIEW_REAL_FIT_20260707_START */
  function previewInnerSize() {
    const preview = document.getElementById("documentPreview");

    if (!preview) {
      return { width: 1, height: 1 };
    }

    const style = window.getComputedStyle(preview);
    const paddingX =
      parseFloat(style.paddingLeft || "0") +
      parseFloat(style.paddingRight || "0");
    const paddingY =
      parseFloat(style.paddingTop || "0") +
      parseFloat(style.paddingBottom || "0");

    return {
      width: Math.max(1, preview.clientWidth - paddingX),
      height: Math.max(1, preview.clientHeight - paddingY)
    };
  }

  function previewTargetNaturalSize(target) {
    if (!target) {
      return { width: 1, height: 1 };
    }

    if (target.tagName === "IMG") {
      return {
        width: Math.max(1, target.naturalWidth || target.width || 1),
        height: Math.max(1, target.naturalHeight || target.height || 1)
      };
    }

    return previewInnerSize();
  }

  function currentPreviewTarget() {
    const preview = document.getElementById("documentPreview");

    if (!preview) {
      return null;
    }

    return preview.querySelector(".document-preview-image, .document-preview-frame");
  }

  function applyDocumentPreviewRotation() {
    const target = currentPreviewTarget();

    if (!target) {
      scheduleDocumentPreviewFit();
      return;
    }

    const box = previewInnerSize();
    const natural = previewTargetNaturalSize(target);
    const rotation = ((documentPreviewRotation % 360) + 360) % 360;
    const sideways = rotation === 90 || rotation === 270;

    const logicalWidth = sideways ? natural.height : natural.width;
    const logicalHeight = sideways ? natural.width : natural.height;

    const scale = Math.min(
      box.width / logicalWidth,
      box.height / logicalHeight
    );

    const displayWidth = natural.width * scale;
    const displayHeight = natural.height * scale;
    const displayWidthPercent = box.width > 0 ? (displayWidth / box.width) * 100 : 100;
    const displayHeightPercent = box.height > 0 ? (displayHeight / box.height) * 100 : 100;

    target.style.width = Math.max(0, Math.min(100, displayWidthPercent)) + "%";
    target.style.height = Math.max(0, Math.min(100, displayHeightPercent)) + "%";
    target.style.maxWidth = "none";
    target.style.maxHeight = "none";
    target.style.transform = "rotate(" + rotation + "deg)";
    target.style.transformOrigin = "center center";
  }

  function scheduleDocumentPreviewFit() {
    window.setTimeout(() => {
      applyDocumentPreviewRotation();
    }, 0);

    window.setTimeout(() => {
      applyDocumentPreviewRotation();
    }, 80);
  }

  window.addEventListener("resize", () => {
    scheduleDocumentPreviewFit();
  });
/* PAYMENT_DOCUMENT_REVIEW_PREVIEW_REAL_FIT_20260707_END */

  function rotateDocumentPreview(degrees) {
    documentPreviewRotation = (documentPreviewRotation + Number(degrees || 0)) % 360;

    if (documentPreviewRotation < 0) {
      documentPreviewRotation += 360;
    }

    applyDocumentPreviewRotation();
  }

  function resetDocumentPreviewRotation(shouldApply = true) {
    documentPreviewRotation = 0;

    if (shouldApply) {
      applyDocumentPreviewRotation();
    }
  }
/* PAYMENT_DOCUMENT_REVIEW_PREVIEW_ROTATE_20260707_END */
function setDocumentPreview(item) {
    const preview = document.getElementById("documentPreview");

    if (!preview) {
      scheduleDocumentPreviewFit();
      return;
    }

    if (!item) {
      preview.innerHTML = '<div class="preview-empty">左からDB保存済みOCRを選択してください。</div>';
      scheduleDocumentPreviewFit();
      return;
    }

    const url = documentPreviewUrl(item);
    const name = item.originalFileName || item.savedFileName || item.fileName || "原本";

    if (!url) {
      preview.innerHTML =
        '<div class="preview-empty">原本ファイルの参照先がありません。</div>';
      scheduleDocumentPreviewFit();
      return;
    }

    if (isPreviewPdf(item, url)) {
      preview.innerHTML =
        '<iframe class="document-preview-frame" src="' + esc(url) + '" title="' + esc(name) + '"></iframe>';
      scheduleDocumentPreviewFit();
      return;
    }

    if (isPreviewImage(item, url)) {
      preview.innerHTML =
        '<img class="document-preview-image" onload="scheduleDocumentPreviewFit()" src="' + esc(url) + '" alt="' + esc(name) + '">';
      scheduleDocumentPreviewFit();
      return;
    }

    preview.innerHTML =
      '<div class="preview-empty">' +
      '<div>この形式は画面内プレビュー対象外です。</div>' +
      '<a href="' + esc(url) + '" target="_blank" rel="noopener">原本を開く</a>' +
      '</div>';
  }

  function labelTextOnly(label) {
    const clone = label.cloneNode(true);

    clone.querySelectorAll("input, select, textarea, option, button").forEach(node => node.remove());

    return normalizeLabelText(clone.textContent);
  }

  function findControlByLabelText(labelText) {
    const wanted = normalizeLabelText(labelText);

    if (!wanted) {
      return null;
    }

    const labels = Array.from(document.querySelectorAll("label"));

    for (const label of labels) {
      const text = labelTextOnly(label);

      if (!text) {
        continue;
      }

      if (text !== wanted && !text.startsWith(wanted) && !wanted.startsWith(text)) {
        continue;
      }

      if (label.htmlFor) {
        const byFor = document.getElementById(label.htmlFor);

        if (byFor) {
          return byFor;
        }
      }

      const control = label.querySelector("input, select, textarea");

      if (control) {
        return control;
      }
    }

    return null;
  }

    if (value === null || value === undefined || value === "") {
      return false;
    }

    const control = findControlByLabelText(labelText);

    return setControlValue(control, value);

    if (!control || !control.classList) {

    }

    control.classList.remove("ai-master-unmatched");
    delete control.dataset.aiMasterUnmatched;
    delete control.dataset.aiUnmatchedValue;

  function markAiMasterUnmatched(control, text) {
    if (!control || !control.classList) {
      return;
    }

    control.value = "";
    control.dataset.aiMasterUnmatched = "1";
    control.dataset.aiUnmatchedValue = text || "";

  function aiDebugValue(label, value) {
    if (value === null || value === undefined || value === "") {
      return "";
    }

    if (Array.isArray(value)) {
      return value.length ? value.map(item => {
        if (item && typeof item === "object") {
          return JSON.stringify(item);
        }
        return String(item ?? "");
      }).filter(Boolean).join("\n") : "";
    }

    if (typeof value === "object") {
      try {
        return JSON.stringify(value, null, 2);
      } catch {
        return String(value);
      }
    }

    return String(value);
  }

  function aiDebugIsEmptyValue(value) {
    if (value === null || value === undefined || value === "") {

    }

    if (Array.isArray(value)) {

    }

    return false;

  function aiDebugMarkControl(control, value) {
    if (!control || !control.classList) {
      return;
    }

    control.classList.remove("ai-filled", "ai-null", "ai-object");

    if (!control.dataset.originalPlaceholder && control.placeholder) {
      control.dataset.originalPlaceholder = control.placeholder;
    }

    if (aiDebugIsEmptyValue(value)) {
      control.classList.add("ai-null");
      if ("placeholder" in control) {
        control.placeholder = "";
      }
      return;
    }

    if ("placeholder" in control && control.dataset.originalPlaceholder) {
      control.placeholder = control.dataset.originalPlaceholder;
    }

    if (aiDebugIsObjectValue(value)) {
      control.classList.add("ai-object");
      return;
    }

  }

  function setDebugControlValue(control, label, value) {
    if (!control) {
      return false;
    }

    const text = aiDebugValue(label, value);

    if (control.tagName === "SELECT") {
      resetAiMasterSelectState(control);
      if (!text) {
        control.value = "";
      } else {
        let matched = false;

        for (const option of Array.from(control.options || [])) {
          const optionValue = String(option.value || "").trim();
          const optionText = String(option.textContent || "").trim();

          if (optionValue === text || optionText === text) {
            control.value = option.value;
            matched = true;
            break;
          }
        }

        if (!matched) {
          markAiMasterUnmatched(control, text);
        }
      }
    } else {
      control.value = text;
    }

    aiDebugMarkControl(control, value);

    control.dataset.aiLinked = "1";
    control.dataset.aiLinkedLabel = label;
    control.dispatchEvent(new Event("input", { bubbles: true }));
    control.dispatchEvent(new Event("change", { bubbles: true }));

    return true;
  }

  function labelTextOnly(label) {
    const clone = label.cloneNode(true);

    return normalizeLabelText(clone.textContent);
  }

  function findControlByLabelText(labelText) {
    const wanted = normalizeLabelText(labelText);

    if (!wanted) {
      return null;
    }

    const labels = Array.from(document.querySelectorAll("label"));

    for (const label of labels) {
      const text = labelTextOnly(label);

      if (!text) {
        continue;
      }

      if (text !== wanted && !text.startsWith(wanted) && !wanted.startsWith(text)) {
        continue;
      }

      if (label.htmlFor) {
        const byFor = document.getElementById(label.htmlFor);

        if (byFor) {
          return byFor;
        }
      }

      const control = label.querySelector("input, select, textarea");

      if (control) {
        return control;
      }
    }

    return null;
  }

  function setDebugByLabel(label, value) {

  function getFieldLabelText(control) {
    if (!control) return "";

    const label = control.closest("label");

    if (!label) return "";

    const parts = [];

    for (const node of Array.from(label.childNodes || [])) {
      if (node.nodeType === Node.TEXT_NODE) {
        const text = String(node.textContent || "").trim();
        if (text) parts.push(text);
      }
    }

    return parts.join("").replace(/\s+/g, "").trim();
  }

  function getFieldValue(control) {
    if (!control) return "";

    if (control.tagName === "SELECT") {
      resetAiMasterSelectState(control);
      const option = control.options && control.selectedIndex >= 0
        ? control.options[control.selectedIndex]
        : null;

      const value = String(control.value || "").trim();
      const text = option ? String(option.textContent || "").trim() : "";

      if (!value) return "";
      if (text === "マスタ読込中..." || text === "マスタ読込中.") return "";
      return text || value;
    }

    return String(control.value || "").trim();
  }

    document.body.classList.remove("ai-analysis-initial");
    document.body.classList.add("ai-analysis-done");

    document.querySelectorAll(".post-ai-action").forEach(button => {
      button.style.display = "";

    document.querySelectorAll(".analysis-form-scroll .analysis-section").forEach(section => {
      let sectionHasVisibleField = false;
      const title = section.querySelector(".analysis-section-title");
      const titleText = normalizeLabelText(title ? title.textContent : "");

      if (section.classList.contains("stage1-sorting-block")) {
        section.classList.remove("ai-section-hidden");
        section.querySelectorAll("label").forEach(label => {
          label.classList.remove("ai-field-hidden");

      }

      if (titleText === normalizeLabelText("AI判定サマリー")) {
        section.classList.remove("ai-section-hidden");
        section.querySelectorAll("label").forEach(label => {
          label.classList.remove("ai-field-hidden");
        });

      }

      section.querySelectorAll("label").forEach(label => {
        const control = label.querySelector("input, select, textarea");
        const labelText = normalizeLabelText(getFieldLabelText(control));
        const hasValue = !!getFieldValue(control);
        const shouldShow = hasValue || visibleSet.has(labelText);

        if (shouldShow) {
          label.classList.remove("ai-field-hidden");
          sectionHasVisibleField = true;
        } else {
          label.classList.add("ai-field-hidden");
        }
      });

      if (sectionHasVisibleField) {
        section.classList.remove("ai-section-hidden");
      } else {
        section.classList.add("ai-section-hidden");
      }
    });
  }

  function normalizeLabelText(value) {
    return String(value || "")
      .replace(/\s+/g, "")
      .replace(/：/g, ":")
      .trim();
  }

  function findControlByLabelText(labelText) {
    const wanted = normalizeLabelText(labelText);

    if (!wanted) {
      return null;
    }

    const labels = Array.from(document.querySelectorAll("label, .field-label, .form-label, .label"));

    for (const label of labels) {
      const text = normalizeLabelText(label.textContent);

      if (!text || text !== wanted) {
        continue;
      }

      if (label.htmlFor) {
        const byFor = document.getElementById(label.htmlFor);

        if (byFor) {
          return byFor;
        }
      }

      const parent = label.closest(".field, .form-field, .input-row, .form-row, div") || label.parentElement;

      if (parent) {
        const control = parent.querySelector("input, select, textarea");

        if (control) {
          return control;
        }
      }

      const next = label.nextElementSibling;

      if (next && next.matches && next.matches("input, select, textarea")) {
        return next;
      }
    }

    return null;
  }

  function setControlValue(control, value) {
    if (!control) {
      return false;
    }

    const text = value === null || value === undefined ? "" : String(value);

    if (control.tagName === "SELECT") {
      resetAiMasterSelectState(control);
      setAnalysisMasterSelectValue(control, text);
    } else {
      control.value = text;
    }

    control.dispatchEvent(new Event("input", { bubbles: true }));
    control.dispatchEvent(new Event("change", { bubbles: true }));

    return true;
  }

  function setFieldByLabel(labelText, value) {
    if (value === null || value === undefined || value === "") {
      return false;
    }

    const control = findControlByLabelText(labelText);

    return setControlValue(control, value);
  }

  function applyAiSummaryFields(summary) {
    if (!summary) {
      return;
    }

    setFieldByLabel("書類種別", summary.document_kind);
    setFieldByLabel("処理先", summary.destination);
    setFieldByLabel("支払対象", summary.payment_target);
    setFieldByLabel("未払登録対象", summary.payable_target);
    setFieldByLabel("経費登録対象", summary.expense_target);

    setFieldByLabel("AI信頼度", summary.confidence_label);
    setFieldByLabel("AI判定理由", summary.reason);
  }

  function applyAiFieldMap(fields) {
    if (!fields || typeof fields !== "object") {
      return 0;
    }

    let count = 0;

    for (const [label, value] of Object.entries(fields)) {
      if (setFieldByLabel(label, value)) {
        count++;
      }
    }

    return count;
  }

async function runAnalysisForItemIndex(index, options = {}) {
    if (
      !Array.isArray(items) ||
      index < 0 ||
      index >= items.length
    ) {
      const error =
        "解析する書類が見つかりません。";

      showResult(error);

      return {
        ok: false,
        error
      };
    }

    selectedIndex = index;
    selectItem(index);

    const item = items[index];

    const id = String(
      ocrImportIdOf(item) || ""
    );

    const name =
      item.originalFileName ||
      item.fileName ||
      ("No." + (index + 1));

    if (!id) {
      const error =
        "OCR保存IDがないため解析できません。";

      showResult(error);

      return {
        ok: false,
        name,
        error
      };
    }

    if (!options.silent) {
      showResult(
        "単品仕分け中: " +
        name +
        "\n" +
        "マスタ駆動AIの1回目解析と" +
        "2回目解析を実行しています。" +
        "3回目の専門解析は実行しません。" +
        "画像は送信しません。"
      );
    }

    try {
      const currentCompany =
        hdOriginGetCurrentCompanyForPaymentDocument();
      const requestPayload = hdOriginAiBasicAnalysisRequestPayload(currentCompany);

      const res = await fetch(
        "/api/payment-documents/ai-basic-analysis/" +
        encodeURIComponent(id),
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify(
            requestPayload
          )
        }
      );

      const data = await res.json();

      if (!res.ok || !data.ok) {
        const error =
          data.error ||
          data.message ||
          (
            "マスタ駆動AI解析に失敗しました。" +
            " HTTP=" +
            res.status
          );

        showResult({
          ok: false,
          name,
          error,
          data
        });

        return {
          ok: false,
          name,
          error
        };
      }

      const basicAnalysisResult =
        data.basicAnalysisResult &&
        typeof data.basicAnalysisResult === "object" &&
        !Array.isArray(data.basicAnalysisResult)
          ? data.basicAnalysisResult
          : {};

      const aiSteps =
        Array.isArray(data.ai_steps)
          ? data.ai_steps
          : [];

      const stepNames =
        aiSteps.map(step =>
          String(
            step &&
            step.name
              ? step.name
              : ""
          ).trim()
        );

      if (
        stepNames.length !== 2 ||
        stepNames[0] !== "classification" ||
        stepNames[1] !== "detail"
      ) {
        throw new Error(
          "正規の1回目・2回目解析結果ではありません。" +
          " ai_steps=" +
          JSON.stringify(stepNames)
        );
      }
      item.__visibleFieldLabels =
        Array.isArray(
          data.visible_field_labels
        )
          ? data.visible_field_labels
          : (
              Array.isArray(
                basicAnalysisResult.visibleFieldLabels
              )
                ? basicAnalysisResult.visibleFieldLabels
                : []
            );

      item.__documentGroup =
        data.document_group ||
        basicAnalysisResult.documentGroup ||
        "";

      item.__aiSteps = aiSteps;

      if (
        typeof applyAnalysisResultToFormHardDebug
        !== "function"
      ) {
        throw new Error(
          "AI解析結果を画面へ反映する関数が" +
          "見つかりません。"
        );
      }

      const appliedCount =
        applyAnalysisResultToFormHardDebug(basicAnalysisResult.detail || basicAnalysisResult);

      if (
        typeof showVisibleFieldsOnly
        === "function"
      ) {
        showVisibleFieldsOnly(
          item.__visibleFieldLabels
        );
      }

      window.__lastAnalysisResultAppliedCount =
        appliedCount;

      if (false) {
        throw new Error(
          "基礎解析自動保存関数が" +
          "見つかりません。"
        );
      }

      const autoSaved = {
        ok: true,
        basicAnalysisId: data.basicAnalysisId || data.basic_analysis_id || null
      };

      if (
        !autoSaved ||
        autoSaved.ok !== true
      ) {
        const saveError =
          autoSaved &&
          autoSaved.error
            ? autoSaved.error
            : (
                "1回目・2回目解析結果の" +
                "DB保存に失敗しました。"
              );

        throw new Error(saveError);
      }

      if (
        typeof renderSortingList
        === "function"
      ) {
        renderSortingList();
      }

      if (!options.silent) {
        showResult({
          ok: true,
          message:
            "マスタ駆動AIの1回目解析、" +
            "2回目解析、DB保存が完了しました。" +
            "3回目解析は実行していません。",
          fileName: name,
          ai_steps:
            item.__aiSteps,
          document_group:
            item.__documentGroup,
          visible_field_labels:
            item.__visibleFieldLabels,
          basicAnalysisId: data.basicAnalysisId || data.basic_analysis_id || null,
          appliedCount
        });
      }

      return {
        ok: true,
        name,
        ai_steps:
          item.__aiSteps,
        document_group:
          item.__documentGroup,
        visible_field_labels:
          item.__visibleFieldLabels,
        basicAnalysisId: data.basicAnalysisId || data.basic_analysis_id || null,
        appliedCount
      };
    }
    catch (error) {
      const message =
        error.message ||
        String(error);

      showResult({
        ok: false,
        name,
        error: message
      });

      return {
        ok: false,
        name,
        error: message
      };
    }
  }

      return;

      results.push(result);

      } else {

      }

    renderSortingList();

    showResult({
      ok: failed === 0,
      message: "まとめて仕分けが完了しました。最後に解析した書類を画面へ表示しています。",
      total: indexes.length,
      success,
      failed,
      results
    });
  }

  window.jpSortingLabel = function(value, fallback) {
    const raw = String(value || "").trim();
    if (!raw) return fallback || "未判定";

    const key = raw
      .replace(/[　\s]+/g, "_")
      .replace(/-+/g, "_")
      .toLowerCase();

    return window.sortingLabelMap[key] || raw;
  };

  window.detectSortingTheme = function(text) {
    const s = String(text || "").toLowerCase();

    if (!s) return "unknown";
    if (s.includes("要確認") || s.includes("needs_review") || s.includes("確認")) return "review";
    if (s.includes("税") || s.includes("公的") || s.includes("納付") || s.includes("tax")) return "tax";
    if (s.includes("カード") || s.includes("決済") || s.includes("card") || s.includes("square") || s.includes("paypay") || s.includes("stripe")) return "card";
    if (s.includes("保険") || s.includes("リース") || s.includes("契約") || s.includes("insurance") || s.includes("lease") || s.includes("contract")) return "contract";
    if (s.includes("買掛") || s.includes("仕入") || s.includes("材料") || s.includes("外注") || s.includes("purchase") || s.includes("payable")) return "invoice";
    if (s.includes("未払") || s.includes("accrued") || s.includes("unpaid")) return "unpaid";
    if (s.includes("経費") || s.includes("expense")) return "expense";
    if (s.includes("納品") || s.includes("注文") || s.includes("発注") || s.includes("見積") || s.includes("検収") || s.includes("delivery") || s.includes("quote") || s.includes("order")) return "reference";
    if (s.includes("領収") || s.includes("レシート") || s.includes("receipt")) return "expense";

    return "other";
  };

  window.pickAnalysisValue = function(analysis, keys) {
    if (!analysis || typeof analysis !== "object") return "";

    for (const key of keys) {
      if (analysis[key] !== undefined && analysis[key] !== null && String(analysis[key]).trim() !== "") {
        return analysis[key];
      }
    }

    if (analysis.fields && typeof analysis.fields === "object") {
      for (const key of keys) {
        if (analysis.fields[key] !== undefined && analysis.fields[key] !== null && String(analysis.fields[key]).trim() !== "") {
          return analysis.fields[key];
        }
      }
    }

    return "";
  };

  function getSavedBasicAnalysisResult(item) {

    const result = basic.sortResult || basic.sort_result;

    return result &&
      typeof result === "object" &&
      !Array.isArray(result)

    let theme = window.detectSortingTheme(destinationRaw || accountingRaw || kindRaw || group);

    const lowConfidence =

    const needsReview =

    if (needsReview) {

    return {

  function restoreSavedBasicAnalysisToItem(item) {

  window.applySortingAiResultToItem = function(item, data) {
    if (!item || !data) return;
    item.__visibleFieldLabels = ["会計区分", "専門解析先", "発行日", "信頼度", "理由"];
    item.__documentGroup = data.document_group || (data.basicAnalysisResult && data.basicAnalysisResult.documentGroup) || "";
    item.__aiSteps = data.ai_steps || [];

  window.runAnalysisForItemIndex = async function(index, options = {}) {
    if (
      !Array.isArray(items) ||
      index < 0 ||
      index >= items.length
    ) {
      const error =
        "解析する書類が見つかりません。";

      showResult(error);

      return {
        ok: false,
        error
      };
    }

    selectedIndex = index;
    selectItem(index);

    const item = items[index];

    const id = String(
      window.ocrImportIdOf(item) || ""
    );

    const name =
      item.originalFileName ||
      item.fileName ||
      ("No." + (index + 1));

    if (!id) {
      const error =
        "OCR保存IDがないため解析できません。";

      showResult(error);

      return {
        ok: false,
        name,
        error
      };
    }

    if (!options.silent) {
      showResult(
        "単品仕分け中: " +
        name +
        "\n" +
        "マスタ駆動AIの1回目解析と" +
        "2回目解析を実行しています。" +
        "3回目の専門解析は実行しません。" +
        "画像は送信しません。"
      );
    }

    try {
      const currentCompany =
        hdOriginGetCurrentCompanyForPaymentDocument();
      const requestPayload = hdOriginAiBasicAnalysisRequestPayload(currentCompany);

      const res = await fetch(
        "/api/payment-documents/ai-basic-analysis/" +
        encodeURIComponent(id),
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify(
            requestPayload
          )
        }
      );

      const data = await res.json();

      if (!res.ok || !data.ok) {
        const error =
          data.error ||
          data.message ||
          (
            "マスタ駆動AI解析に失敗しました。" +
            " HTTP=" +
            res.status
          );

        showResult({
          ok: false,
          name,
          error,
          data
        });

        return {
          ok: false,
          name,
          error
        };
      }

      const basicAnalysisResult =
        data.basicAnalysisResult &&
        typeof data.basicAnalysisResult === "object" &&
        !Array.isArray(data.basicAnalysisResult)
          ? data.basicAnalysisResult
          : {};

      const aiSteps =
        Array.isArray(data.ai_steps)
          ? data.ai_steps
          : (
              Array.isArray(data.steps)
                ? data.steps
                : []
            );

      const stepNames =
        aiSteps.map(step =>
          String(
            step &&
            step.name
              ? step.name
              : ""
          ).trim()
        );

      if (
        stepNames.length !== 2 ||
        stepNames[0] !== "classification" ||
        stepNames[1] !== "detail"
      ) {
        throw new Error(
          "正規の1回目・2回目解析結果ではありません。" +
          " ai_steps=" +
          JSON.stringify(stepNames)
        );
      }
      item.__visibleFieldLabels =
        Array.isArray(
          data.visible_field_labels
        )
          ? data.visible_field_labels
          : (
              Array.isArray(
                basicAnalysisResult.visibleFieldLabels
              )
                ? basicAnalysisResult.visibleFieldLabels
                : []
            );

      item.__documentGroup =
        data.document_group ||
        basicAnalysisResult.documentGroup ||
        "";

      item.__aiSteps = aiSteps;
      item.__aiRawResult = data;

      if (
        typeof applyAnalysisResultToFormHardDebug
        !== "function"
      ) {
        throw new Error(
          "AI解析結果を画面へ反映する関数が" +
          "見つかりません。"
        );
      }

      const appliedCount =
        applyAnalysisResultToFormHardDebug(basicAnalysisResult.detail || basicAnalysisResult);

      if (
        typeof showVisibleFieldsOnly
        === "function"
      ) {
        showVisibleFieldsOnly(
          item.__visibleFieldLabels
        );
      }

      window.__lastAnalysisResultAppliedCount =
        appliedCount;

      if (false) {
        throw new Error(
          "基礎解析自動保存関数が" +
          "見つかりません。"
        );
      }

      const autoSaved = {
        ok: true,
        basicAnalysisId: data.basicAnalysisId || data.basic_analysis_id || null
      };

      if (
        !autoSaved ||
        autoSaved.ok !== true
      ) {
        const saveError =
          autoSaved &&
          autoSaved.error
            ? autoSaved.error
            : (
                "1回目・2回目解析結果の" +
                "DB保存に失敗しました。"
              );

        throw new Error(saveError);
      }

      if (
        typeof window.renderSortingList
        === "function"
      ) {
        window.renderSortingList();
      }

      const visual =
        typeof window.buildSortingVisual
        === "function"
          ? window.buildSortingVisual(item)
          : {};

      if (!options.silent) {
        showResult({
          ok: true,
          message:
            "マスタ駆動AIの1回目解析、" +
            "2回目解析、DB保存が完了しました。" +
            "3回目解析は実行していません。",
          fileName: name,
          ai_steps:
            item.__aiSteps,
          document_group:
            item.__documentGroup,
          visible_field_labels:
            item.__visibleFieldLabels,
          basicAnalysisId: data.basicAnalysisId || data.basic_analysis_id || null,
          appliedCount
        });
      }

      return {
        ok: true,
        name,
        kind:
          visual.kindLabel || "",
        destination:
          visual.destinationLabel || "",
        accounting:
          visual.accountingLabel || "",
        confidence:
          visual.confidenceLabel || "",
        needsReview:
          visual.needsReview === true,
        ai_steps:
          item.__aiSteps,
        document_group:
          item.__documentGroup,
        basicAnalysisId: data.basicAnalysisId || data.basic_analysis_id || null,
        appliedCount
      };
    }
    catch (error) {
      const message =
        error.message ||
        String(error);

      showResult({
        ok: false,
        name,
        error: message
      });

      return {
        ok: false,
        name,
        error: message
      };
    }
  };

  window.runSelectedAnalyses = async function() {
    const indexes = window.selectedSortingIndexes();

    if (!indexes.length) {
      showResult("まとめて仕分けする書類にチェックを入れてください。");
      return;
    }

    const results = [];
    let success = 0;
    let failed = 0;
    let review = 0;

    for (let i = 0; i < indexes.length; i++) {
      const index = indexes[i];
      const item = items[index] || {};
      const name = item.originalFileName || item.fileName || ("No." + (index + 1));

      showResult("まとめて仕分け中: " + (i + 1) + " / " + indexes.length + "\n" + name);

      const result = await window.runAnalysisForItemIndex(index, { silent: true });

      results.push(result);

      if (result && result.ok) {
        success++;
        if (result.needsReview) review++;
      } else {
        failed++;
      }

      window.renderSortingList();
    }

    await loadItems();

    const grouped = results
      .filter(row => row && row.ok)
      .reduce((acc, row) => {
        const key = row.destination || "未判定";
        acc[key] = (acc[key] || 0) + 1;
        return acc;
      }, {});

    const groupedText = Object.keys(grouped)
      .map(key => key + ": " + grouped[key] + "件")
      .join("\n");

    const failedText = results
      .filter(row => !row || !row.ok)
      .map((row, index) => {
        const failedName =
          row && row.name
            ? row.name
            : ("失敗項目" + (index + 1));

        const failedError =
          row && row.error
            ? row.error
            : "エラー内容を取得できませんでした。";

        return failedName + "\n" + failedError;
      })
      .join("\n\n");

    showResult(
      "まとめて仕分けが完了しました。\n" +
      "対象: " + indexes.length + "件\n" +
      "成功: " + success + "件\n" +
      "失敗: " + failed + "件\n" +
      "要確認: " + review + "件\n\n" +
      "行き先別:\n" +
      (groupedText || "なし") +
      (
        failedText
          ? "\n\n失敗詳細:\n" + failedText
          : ""
      )
    );
  };

  window.runSelectedSpecialistRouting = async function() {
    const indexes = window.selectedSortingIndexes();

    if (!indexes.length) {
      showResult("まとめて振り分けする書類にチェックを入れてください。");
      return;
    }

    const excluded = [];
    const routeable = indexes.map(index => {
      const item = items[index] || {};
      const id = Number(window.ocrImportIdOf(item) || 0);

      if (!id) {
        excluded.push("OCR取込IDを取得できない書類");
        return null;
      }

      if (item.canRouteToSpecialist !== true) {
        excluded.push(
          "OCR取込ID " + id +
          ": current_statusが専門解析への振り分け可能状態ではありません。"
        );
        return null;
      }

      return { id };
    }).filter(Boolean);

    if (!routeable.length) {
      showResult(
        "振り分け対象の正式基礎解析完了書類がありません。\n" +
        (excluded.length ? excluded.join("\n") : "")
      );
      return;
    }

    const button = document.getElementById("bulkSpecialistRoutingButton");
    const oldText = button ? button.textContent : "まとめて振り分け";

    try {
      const company = hdOriginGetCurrentCompanyForPaymentDocument();

      if (button) {
        button.disabled = true;
        button.textContent = "振り分け中 0 / " + routeable.length;
      }

      showResult(
        "選択した正式基礎解析完了書類を専門解析工程へ振り分けます。\n" +
        "専門解析そのものはまだ実行しません。\n" +
        "対象: " + routeable.length + "件"
      );

      const response = await fetch(

        {

          headers: {

          },
          body: JSON.stringify({
            payment_document_ocr_import_ids:
              routeable.map(row => row.id),
            company_id: company.company_id,
            company_code: company.company_code
          })
        }
      );
      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(data.error || ("HTTP " + response.status));
      }

      if (button) {
        button.textContent = "振り分け中 " + routeable.length + " / " + routeable.length;
      }

      const results = Array.isArray(data.results) ? data.results : [];
      const successfulIds = new Set(
        results
          .filter(row => row && row.ok)
          .map(row => String(row.payment_document_ocr_import_id || ""))
          .filter(Boolean)
      );
      const failedDetails = results
        .filter(row => row && !row.ok)
        .map(row =>
          "OCR取込ID " +
          String(row.payment_document_ocr_import_id || "") +
          ": " +
          String(row.error || "振り分けに失敗しました。")
        );

      successfulIds.forEach(id => {
        window.__checkedOcrImportIds.delete(id);
      });

      await loadItems();

      showResult(
        "まとめて振り分けが完了しました。\n" +
        "成功: " + Number(data.success || 0) + "件\n" +
        "失敗: " + Number(data.failed || 0) + "件\n" +
        "除外: " + excluded.length + "件\n" +
        "成功した書類は専門解析工程へ移動しました。\n" +
        "専門解析そのものはまだ実行していません。" +
        (
          excluded.length
            ? "\n\n除外理由:\n" + excluded.join("\n")
            : ""
        ) +
        (
          failedDetails.length
            ? "\n\n失敗詳細:\n" + failedDetails.join("\n")
            : ""
        )
      );
    } catch (error) {
      showResult(
        "まとめて振り分けに失敗しました。\n" +
        (error.message || String(error))
      );
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = oldText || "まとめて振り分け";
      }
    }
  };

async function loadItems() {
    const summary = document.getElementById("summary");
    const list = document.getElementById("list");

    summary.textContent = "読込中...";
    list.innerHTML = "";
    selectedIndex = -1;

    document.getElementById("ocrText").value = "";
    setBottomOcrText("");
    clearAnalysisFields();
    setInitialAiOnlyView();

    try {

<script>
(function () {
  function cleanText(value) {
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function showResultSafe(value) {
    var text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    var result = document.getElementById("result");

    if (result) {
      result.textContent = text;
      result.classList.add("has-message");
      return;
    }

    alert(text);
  }

  function isElementActuallyVisible(element) {
    if (!element) return false;

    if (element.closest(".ai-section-hidden")) return false;
    if (element.closest(".ai-field-hidden")) return false;

    var node = element;

    while (node && node.nodeType === 1) {
      if (node.hidden) return false;

      var style = window.getComputedStyle(node);

      if (!style) return false;
      if (style.display === "none") return false;
      if (style.visibility === "hidden") return false;

      if (node === document.body) break;

      node = node.parentElement;
    }

    return true;
  }

  function labelFor(control) {
    if (!control) return "";

    var label = control.closest("label");

    if (!label) {
      return control.id || control.name || control.tagName || "";
    }

    var clone = label.cloneNode(true);

    clone.querySelectorAll("input, select, textarea, button, option").forEach(function (el) {
      el.remove();
    });

    return cleanText(clone.textContent) || control.id || control.name || "";
  }

  function sectionFor(control) {
    var section = control && control.closest(".analysis-section");

    if (!section) {
      return "未分類";
    }

    var title = section.querySelector(".analysis-section-title");

    return title ? cleanText(title.textContent) : "未分類";
  }

  function valueFor(control) {
    if (!control) {
      return {
        value: "",
        displayText: ""
      };
    }

    if (control.tagName === "SELECT") {
      var option = control.options && control.selectedIndex >= 0
        ? control.options[control.selectedIndex]
        : null;

      return {
        value: String(control.value || ""),
        displayText: option ? cleanText(option.textContent) : ""
      };
    }

    return {
      value: control.value === null || control.value === undefined ? "" : String(control.value),
      displayText: ""
    };
  }

  function collectVisibleFieldsOnly() {
    var controls = Array.from(document.querySelectorAll(".analysis-panel .analysis-field"))
      .filter(function (control) {
        if (!control || control.type === "hidden") return false;

        var label = control.closest("label") || control;
        var section = control.closest(".analysis-section");

        if (!isElementActuallyVisible(section || label)) return false;
        if (!isElementActuallyVisible(label)) return false;
        if (!isElementActuallyVisible(control)) return false;

        return true;
      });

    return controls.map(function (control, index) {
      var valueInfo = valueFor(control);

      return {
        no: index + 1,
        section: sectionFor(control),
        label: labelFor(control),
        id: control.id || "",
        tagName: control.tagName || "",
        type: control.type || "",
        value: valueInfo.value,
        displayText: valueInfo.displayText,
        placeholder: control.getAttribute("placeholder") || "",
        masterType: control.dataset ? (control.dataset.masterType || "") : "",
        masterLabel: control.dataset ? (control.dataset.masterLabel || "") : ""
      };
    });
  }

  function safeSelectedIndex() {
    try {
      if (typeof selectedIndex === "number") {
        return selectedIndex;
      }
    } catch (error) {
      return -1;
    }

    return -1;
  }

  function safeSelectedItem() {
    try {
      if (typeof items !== "undefined" && Array.isArray(items)) {
        var index = safeSelectedIndex();

        if (index >= 0 && items[index]) {
          return items[index];
        }
      }
    } catch (error) {
      return null;
    }

    return null;
  }

  function safeSelectedOcrImportId() {
    try {
      if (typeof selectedOcrImportId === "function") {
        return selectedOcrImportId() || "";
      }
    } catch (error) {
      // noop
    }

    var item = safeSelectedItem();

    if (!item) {
      return "";
    }

    return item.paymentDocumentOcrImportId || item.payment_document_ocr_import_id || "";
  }

  async function exportVisibleFieldsMemoVisibleOnly() {
    var button = document.getElementById("visibleFieldsMemoButton") || document.querySelector(".mini-memo-button");
    var oldText = button ? button.textContent : "";
    var item = safeSelectedItem();

    if (button) {
      button.disabled = true;
      button.textContent = "出力中";
    }

    try {
      var fields = collectVisibleFieldsOnly();

      var payload = {
        pageTitle: document.title || "",
        pagePath: location.pathname,
        selectedIndex: safeSelectedIndex(),
        selectedOcrImportId: safeSelectedOcrImportId(),
        selectedItem: item ? {
          paymentDocumentOcrImportId: item.paymentDocumentOcrImportId || item.payment_document_ocr_import_id || "",
          originalFileName: item.originalFileName || "",
          savedFileName: item.savedFileName || item.fileName || "",
          mimeType: item.mimeType || "",
          ocrStatus: item.ocrStatus || "",
          savedAt: item.savedAt || "",
          updatedAt: item.updatedAt || ""
        } : null,
                ocrRawText: item ? String(item.ocrRawText || item.ocr_raw_text || item.ocrText || "") : "",
        ocrTextLength: item ? Number(item.ocrTextLength || item.ocr_text_length || String(item.ocrRawText || item.ocr_raw_text || item.ocrText || "").length || 0) : 0,sortingAppliedCount: window.__lastAnalysisResultAppliedCount || 0,
        aiMissingControls: Array.isArray(window.__lastAnalysisResultMissingControls) ? window.__lastAnalysisResultMissingControls : [],
        fields: fields
      };

      showResultSafe({
        ok: true,
        message: "表示中の項目だけをmemoへ出します。",
        visibleFieldCount: fields.length
      });

      var res = await fetch("/api/payment-documents/review-visible-fields-memo", {
        method: "POST",
        headers: {
          "Content-Type": "application/json; charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      var responseText = await res.text();
      var data = {};

      try {
        data = JSON.parse(responseText || "{}");
      } catch (error) {
        throw new Error("API応答がJSONではありません: " + responseText.slice(0, 300));
      }

      if (!res.ok || !data.ok) {
        throw new Error(data.error || data.message || ("HTTP " + res.status));
      }

      showResultSafe({
        ok: true,
        message: "表示中の項目だけをmemoへ出しました。",
        count: data.count,
        memoPath: data.memoPath,
        openedNotepad: data.openedNotepad
      });
    } catch (error) {
      showResultSafe({
        ok: false,
        error: error.message || String(error)
      });
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = oldText || "表示";
      }
    }
  }

  function attachVisibleMemoButton() {
    var button = document.getElementById("visibleFieldsMemoButton") || document.querySelector(".mini-memo-button");

    if (!button) {
      return;
    }

    button.onclick = null;

    button.addEventListener("click", function (event) {
      event.preventDefault();
      exportVisibleFieldsMemoVisibleOnly();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", attachVisibleMemoButton);
  } else {
    attachVisibleMemoButton();
  }

  window.exportVisibleFieldsMemoVisibleOnly = exportVisibleFieldsMemoVisibleOnly;
})();
</script>

<script>
(function () {

  function textOf(value) {

      '      <div class="hd-analyze-progress-bar" id="hdAnalyzeProgressBar"></div>',
      '    </div>',
      '    <div class="hd-analyze-busy-detail" id="hdAnalyzeBusyDetail">画面を閉じずにお待ちください。</div>',
      '  </div>',
      '</div>'
    ].join("");

    document.body.appendChild(panel);
    return panel;
  }

  function setAnalyzeButtonsDisabled(disabled) {
    const selector = [
      'button[onclick*="runSelectedAnalyses"]',
      'button[onclick*="runAnalysisForItemIndex"]',
      'button[onclick*="runAnalysisFromSelectedOcr"]',
      '.sorting-bulk-analyze',
      '.sorting-single-analyze',
      '.action-ai'
    ].join(",");

    document.querySelectorAll(selector).forEach(button => {
      if (!button) return;

      if (disabled) {
        if (!button.dataset.hdAnalyzeOldDisabled) {
          button.dataset.hdAnalyzeOldDisabled = button.disabled ? "1" : "0";
        }

        button.disabled = true;
        button.classList.add("hd-analyze-button-disabled");
      } else {
        if (button.dataset.hdAnalyzeOldDisabled === "0") {
          button.disabled = false;
        }

        if (button.dataset.hdAnalyzeOldDisabled === "1") {
          button.disabled = true;
        }

        delete button.dataset.hdAnalyzeOldDisabled;
        button.classList.remove("hd-analyze-button-disabled");
      }
    });
  }

  window.hdPaymentSetAnalyzeBusy = function (active, options) {
    const panel = ensureAnalyzeBusyPanel();
    const opt = options || {};

    const title = document.getElementById("hdAnalyzeBusyTitle");
    const sub = document.getElementById("hdAnalyzeBusySub");
    const detail = document.getElementById("hdAnalyzeBusyDetail");
    const bar = document.getElementById("hdAnalyzeProgressBar");

    if (active) {
      document.body.classList.add("hd-analyze-busy");
      panel.classList.add("visible");

      if (title) title.textContent = opt.title || "仕分け中です";
      if (sub) sub.textContent = opt.sub || "AIが仕分け候補を作成しています。";

      const current = Number(opt.current || 0);
      const total = Number(opt.total || 0);
      const fileName = String(opt.fileName || "").trim();

      if (detail) {
        if (total > 0 && current > 0) {
          detail.textContent =
            "処理中: " + current + " / " + total +
            (fileName ? "　" + fileName : "");
        } else {
          detail.textContent = fileName || opt.detail || "画面を閉じずにお待ちください。";
        }
      }

      if (bar) {
        if (total > 0 && current > 0) {
          const percent = Math.max(4, Math.min(100, Math.round((current / total) * 100)));
          bar.style.width = percent + "%";
          bar.classList.remove("indeterminate");

          bar.style.width = "45%";
          bar.classList.add("indeterminate");

      }

      setAnalyzeButtonsDisabled(true);

      document.body.classList.remove("hd-analyze-busy");
      panel.classList.remove("visible");
      setAnalyzeButtonsDisabled(false);

      if (bar) {
        bar.style.width = "0%";
        bar.classList.remove("indeterminate");
      }

  window.hdPaymentAnalyzeStep = function (current, total, fileName) {
    window.hdPaymentSetAnalyzeBusy(true, {

      current: current,
      total: total,
      fileName: fileName || ""
    });

  function parseProgressMessage(message) {
    const text = textOf(message);

    if (!text) return;

    if (text.includes("まとめて解析中") || text.includes("まとめて仕分け中")) {
      const match = text.match(/(\d+)\s*\/\s*(\d+)/);
      const lines = text.split(/\r?\n/);
      const fileName = lines.length ? lines[lines.length - 1] : "";

      window.__hdOriginPaymentBulkBusyRunning = true;

      window.hdPaymentSetAnalyzeBusy(true, {
        title: "まとめて仕分け中です",
        sub: "選択した書類を1件ずつAI仕分けしています。",
        current: match ? Number(match[1]) : 0,
        total: match ? Number(match[2]) : 0,
        fileName: fileName || ""
      });

      return;
    }

    if (
      text.includes("単品解析中") ||
      text.includes("単品仕分け中") ||
      text.includes("AIで書類分類") ||
      text.includes("必要項目だけ抽出")
    ) {
      if (window.__hdOriginPaymentBulkBusyRunning) {
        return;
      }

      window.hdPaymentSetAnalyzeBusy(true, {
        title: "単品仕分け中です",
        sub: "OCR本文から種類・行き先を判定しています。",
        detail: "AI応答待ちです。画面を閉じずにお待ちください。"
      });

      return;
    }

    if (
      text.includes("まとめて解析が完了") ||
      text.includes("まとめて仕分けが完了") ||
      text.includes("解析が完了") ||
      text.includes("仕分けが完了") ||

      text.includes("AI仕分け失敗") ||
      text.includes("解析する書類が見つかりません") ||
      text.includes("仕分けする書類が見つかりません") ||
      text.includes("エラー")
    ) {
      if (text.includes("まとめて解析が完了") || text.includes("まとめて仕分けが完了")) {
        window.__hdOriginPaymentBulkBusyRunning = false;
      }

      window.setTimeout(function () {
        if (!window.__hdOriginPaymentBulkBusyRunning) {
          window.hdPaymentSetAnalyzeBusy(false);
        }
      }, 900);
    }
  }

  function wrapShowResult() {
    if (typeof window.showResult !== "function") return false;

    if (window.showResult.__hdAnalyzeBusyWrappedV2) {
      return true;
    }

    const originalShowResult = window.showResult;

    const wrapped = function (message) {
      parseProgressMessage(message);
      return originalShowResult.apply(this, arguments);
    };

    wrapped.__hdAnalyzeBusyWrappedV2 = true;

    return true;
  }

  function wrapAnalyzerFunction(name) {
    const fn = window[name];

    if (typeof fn !== "function") return false;

    if (fn.__hdAnalyzeBusyWrappedV2) {
      return true;
    }

    const original = fn;

    const wrapped = async function () {
      const isBulk = name === "runSelectedAnalyses";
      const wasBulkRunning = window.__hdOriginPaymentBulkBusyRunning;

      if (isBulk) {
        window.__hdOriginPaymentBulkBusyRunning = true;

        window.hdPaymentSetAnalyzeBusy(true, {
          title: "まとめて仕分け中です",
          sub: "選択した書類を順番に仕分けています。",

          sub: "AIが仕分け候補を作成しています。",
          detail: "動いています。画面を閉じずにお待ちください。"
        });
      }

      try {
        return await original.apply(this, arguments);
      } finally {
        if (isBulk) {
          window.__hdOriginPaymentBulkBusyRunning = false;

          window.setTimeout(function () {
            window.hdPaymentSetAnalyzeBusy(false);
          }, 1000);
        } else {
          if (!wasBulkRunning && !window.__hdOriginPaymentBulkBusyRunning) {
            window.setTimeout(function () {
              window.hdPaymentSetAnalyzeBusy(false);
            }, 900);
          }
        }
      }
    };

    wrapped.__hdAnalyzeBusyWrappedV2 = true;
    window[name] = wrapped;

    return true;
  }

  function installAnalyzeBusyHooks() {
    ensureAnalyzeBusyPanel();

    wrapShowResult();
    wrapAnalyzerFunction("runSelectedAnalyses");
    wrapAnalyzerFunction("runAnalysisForItemIndex");
    wrapAnalyzerFunction("runAnalysisFromSelectedOcr");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", installAnalyzeBusyHooks);
  } else {
    installAnalyzeBusyHooks();
  }

  let retryCount = 0;
  const timer = window.setInterval(function () {
    retryCount++;
    installAnalyzeBusyHooks();

    if (retryCount >= 20) {
      window.clearInterval(timer);
    }
  }, 250);
})();

        if (draft) dbAnalysisCount++;
        if (ocr) ocrCount++;

        var section = "全件DB正式基礎解析結果 / " + no + " / " + name;

        addDbAnalysisFields(fields, item, draft, section);

        allOcrParts.push(
          "==============================\n" +
          no + " " + name + "\n" +
          "OCR取込ID: " + id + "\n" +
          "DB正式基礎解析結果: " + (draft ? "あり" : "なし") + "\n" +
          "==============================\n" +
          (ocr || "[OCR本文なし]")
        );
      });

      var allOcrText = allOcrParts.join("\n\n");

      var payload = {
        pageTitle: document.title || "",
        pagePath: location.pathname,
        displayMode: "all_db_latest",
        selectedIndex: -1,
        selectedOcrImportId: "ALL_DB_LATEST",
        selectedItem: {
          paymentDocumentOcrImportId: "ALL_DB_LATEST",
          originalFileName: "DB全件表示: " + list.length + "件",
          savedFileName: "",
          mimeType: "",
          ocrStatus: "全件",
          savedAt: "",
          updatedAt: ""
        },
        ocrRawText: allOcrText,
        ocrTextLength: allOcrText.length,
        allItemCount: list.length,
        allDbLatestBasicAnalysisCount: dbAnalysisCount,
        allOcrCount: ocrCount,
        fields: fields
      };

      var memo = await postMemo(payload);

      showResultLocal({
        ok: true,
        message: "DB全件正式基礎解析結果をmemoへ出しました。",
        itemCount: list.length,
        dbAnalysisCount: dbAnalysisCount,
        ocrCount: ocrCount,
        fieldCount: fields.length,
        memoPath: memo.memoPath,
        openedNotepad: memo.openedNotepad
      });
    } catch (error) {
      showResultLocal({
        ok: false,
        error: error.message || String(error)
      });
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = oldText || "全件表示";
      }
    }
  }

  function isVisibleButton(button) {
    if (!button) return false;
    if (button.id === "visibleFieldsMemoButton") return true;

    return String(button.textContent || "").trim() === "表示";
  }

  function isAllButton(button) {
    if (!button) return false;
    if (button.id === "visibleAllFieldsMemoButton") return true;

    return String(button.textContent || "").trim() === "全件表示";
  }

  document.addEventListener("click", function (event) {
    var button = event.target && event.target.closest
      ? event.target.closest("button, input[type='button'], input[type='submit'], a")
      : null;

    if (isVisibleButton(button)) {
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      exportVisibleWithDbLatest();
      return;
    }

    if (isAllButton(button)) {
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      exportAllWithDbLatest();
      return;
    }
  }, true);

  window.exportVisibleFieldsMemoVisibleOnlyWithDbLatest = exportVisibleWithDbLatest;
  window.exportAllItemsMemoWithDbLatest = exportAllWithDbLatest;
})();
</script>
<!-- HD_ORIGIN_VISIBLE_MEMO_DB_LATEST_GPT00_20260709_END -->

<!-- HD_ORIGIN_SPECIALIST_NAV_COUNTS_20260722_START -->
<script>
(function () {
  "use strict";

  const reviewItemsUrl = "/api/payment-documents/review-items";
  let refreshTimer = null;
  let refreshRunning = false;

  function objectValue(value) {
    return value &&
      typeof value === "object" &&
      !Array.isArray(value)
        ? value
        : {};
  }

  function analysisSystemCodeOf(item) {
    const latest = objectValue(
      typeof getSavedBasicAnalysisResult === "function"
        ? getSavedBasicAnalysisResult(item)
        : null
    );

    return String(
      latest.analysisSystemCode ||
      latest.analysis_system_code ||
      ""
    ).trim();
  }

  function applySpecialistNavigationCounts(items) {
    const counts = Object.create(null);

    (Array.isArray(items) ? items : []).forEach(function (item) {
      const code = analysisSystemCodeOf(item);

      if (!code) {
        return;
      }

      counts[code] = (counts[code] || 0) + 1;
    });

    document.querySelectorAll(
      ".specialist-system-nav " +
      ".specialist-system-button[data-analysis-system-code]"
    ).forEach(function (button) {
      const code = String(
        button.dataset.analysisSystemCode || ""
      ).trim();

      const label = String(
        button.dataset.baseLabel ||
        button.textContent ||
        ""
      )
        .replace(/\s*（\d+）\s*$/, "")
        .trim();

      button.dataset.baseLabel = label;
      button.textContent =
        label + "（" + (counts[code] || 0) + "）";
    });
  }

  async function refreshSpecialistNavigationCounts() {
    if (refreshRunning) {
      return;
    }

    refreshRunning = true;

    try {
      const response = await fetch(reviewItemsUrl, {
        cache: "no-store"
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error || "専門画面件数の取得に失敗しました。"
        );
      }

            /* HD_ORIGIN_CIL_SAVED_COUNT_FILTER_20260723_START */
      const countSourceItems=Array.isArray(data.items)
        ? data.items
        : [];

      let countVisibleItems=countSourceItems;

      try {
        const cilResponse=await fetch(
          "/api/payment-documents/contract-insurance-lease/list",
          { cache:"no-store" }
        );

        if (cilResponse.ok) {
          const cilData=await cilResponse.json();

          const cilRows=Array.isArray(cilData)
            ? cilData
            : Array.isArray(cilData.items)
              ? cilData.items
              : Array.isArray(cilData.rows)
                ? cilData.rows
                : [];

          const savedCilIds=new Set(
            cilRows
              .map(function (row) {
                return Number(
                  row.payment_document_ocr_import_id ||
                  row.paymentDocumentOcrImportId ||
                  row.ocrImportId ||
                  row.id ||
                  0
                );
              })
              .filter(function (id) {
                return Number.isInteger(id) && id > 0;
              })
          );

          countVisibleItems=countSourceItems.filter(function (item) {
            const id=Number(
              item.paymentDocumentOcrImportId ||
              item.payment_document_ocr_import_id ||
              item.ocrImportId ||
              item.ocr_import_id ||
              item.id ||
              0
            );

            const code=analysisSystemCodeOf(item);

            return !(
              code==="contract_insurance_lease_analysis" &&
              savedCilIds.has(id)
            );
          });
        }
      } catch (error) {
        console.warn(
          "契約・保険・リース保存済み件数の除外に失敗しました。",
          error
        );
      }

      applySpecialistNavigationCounts(countVisibleItems);
      /* HD_ORIGIN_CIL_SAVED_COUNT_FILTER_20260723_END */
    }
    catch (error) {
      console.warn(
        "専門画面件数更新失敗:",
        error
      );
    }
    finally {
      refreshRunning = false;
    }
  }

  function scheduleSpecialistNavigationCounts() {
    window.clearTimeout(refreshTimer);

    refreshTimer = window.setTimeout(function () {
      refreshSpecialistNavigationCounts();
    }, 250);
  }

  function startSpecialistNavigationCounts() {
    refreshSpecialistNavigationCounts();

    const list = document.getElementById("list");

    if (list) {
      const observer = new MutationObserver(function () {
        scheduleSpecialistNavigationCounts();
      });

      observer.observe(list, {
        childList: true,
        subtree: true
      });
    }

    const originalLoadItems = window.loadItems;

    if (
      typeof originalLoadItems === "function" &&
      !originalLoadItems.__specialistCountWrapped
    ) {
      const wrappedLoadItems = async function () {
        try {
          return await originalLoadItems.apply(
            this,
            arguments
          );
        }
        finally {
          scheduleSpecialistNavigationCounts();
        }
      };

      wrappedLoadItems.__specialistCountWrapped = true;
      window.loadItems = wrappedLoadItems;
    }
  }

  window.refreshSpecialistNavigationCounts =
    refreshSpecialistNavigationCounts;

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      startSpecialistNavigationCounts,
      { once: true }
    );
  }
  else {
    startSpecialistNavigationCounts();
  }
})();

</script>
<!-- HD_ORIGIN_SPECIALIST_NAV_COUNTS_20260722_END -->
</body>

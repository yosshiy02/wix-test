<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>出荷納品書 高機能デザイナー (A5縦)</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
        #header { height: 42px; background: #2c3e50; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #domContainer { width: 100vw; height: calc(100vh - 42px); position: absolute; top: 42px; left: 0; }
        button { background: #27ae60; color: white; border: none; padding: 8px 18px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; }
        button:hover { background: #219150; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "@pdfme/ui": "https://esm.sh/@pdfme/ui@5.2.1?external=react,react-dom",
            "@pdfme/schemas": "https://esm.sh/@pdfme/schemas@5.2.1?external=react,react-dom"
        }
    }
    </script>
</head>
<body>
    <div id="header">
        <span><strong>出荷納品書 A5縦 高機能デザイナー (pdfme)</strong></span>
        <button id="exportBtn">テンプレート(JSON)を保存</button>
    </div>
    <div id="domContainer"></div>

    <script type="module">
        import { Designer } from '@pdfme/ui';
        import { text, line, table } from '@pdfme/schemas';

        window.addEventListener('DOMContentLoaded', () => {
            const domContainer = document.getElementById('domContainer');

            function createSectionSchemas(offsetY, isLower) {
                const titleText = isLower ? "出荷納品書（弊社控え）" : "出 荷 納 品 書";
                return [
                    {
                        name: isLower ? "title_lower" : "title_upper",
                        type: "text",
                        content: titleText,
                        position: { x: 44, y: offsetY + 4 },
                        width: 60,
                        height: 8,
                        fontSize: 14,
                        alignment: "center"
                    },
                    {
                        name: isLower ? "doc_number_lower" : "doc_number",
                        type: "text",
                        content: "納品書番号：10000001",
                        position: { x: 98, y: offsetY + 2 },
                        width: 42,
                        height: 4,
                        fontSize: 8,
                        alignment: "right"
                    },
                    {
                        name: isLower ? "doc_date_lower" : "doc_date",
                        type: "text",
                        content: "伝票日付：2026年07月30日",
                        position: { x: 98, y: offsetY + 6 },
                        width: 42,
                        height: 4,
                        fontSize: 8,
                        alignment: "right"
                    },
                    {
                        name: isLower ? "customer_lower" : "customer_name",
                        type: "text",
                        content: "株式会社 サンプル商事 御中",
                        position: { x: 8, y: offsetY + 12 },
                        width: 65,
                        height: 6,
                        fontSize: 11
                    },
                    {
                        name: isLower ? "company_lower" : "company_info",
                        type: "text",
                        content: "株式会社 ハトダイヤ\n〒544-0011 大阪府大阪市生野区田島6-1-8\nTEL: 06-6754-3511 / FAX: 06-6754-3513",
                        position: { x: 75, y: offsetY + 11 },
                        width: 65,
                        height: 12,
                        fontSize: 7,
                        alignment: "right"
                    },
                    {
                        name: isLower ? "subject_lower" : "subject_bar",
                        type: "text",
                        content: "件名：御注文品納品件　　　合計金額（税込）：￥34,100-",
                        position: { x: 8, y: offsetY + 23 },
                        width: 132,
                        height: 6,
                        fontSize: 9,
                        backgroundColor: "#eeeeee",
                        alignment: "left"
                    },
                    {
                        name: isLower ? "table_lower" : "table_upper",
                        type: "table",
                        position: { x: 8, y: offsetY + 30 },
                        width: 132,
                        height: 42,
                        showHead: true,
                        tableStyles: { borderWidth: 0.3, borderColor: "#000000" },
                        headStyles: { fillColor: "#f5f5f5", textColor: "#000000", fontSize: 6, alignment: "center" },
                        bodyStyles: { fontSize: 6, alignment: "center" },
                        head: [["コード", "品名・規格", "21.5", "22.0 S", "22.5", "23.0 M", "23.5", "24.0 L", "24.5 LL", "25.0", "数量", "単価", "金額"]],
                        body: [
                            ["A-001", "レディースローファー Black", "", "1", "2", "2", "1", "", "", "", "6", "4,500", "27,000"],
                            ["B-002", "レザースニーカー White", "", "", "", "1", "", "1", "", "", "2", "2,000", "4,000"],
                            ["", "", "", "", "", "", "", "", "", "", "", "", ""],
                            ["", "", "", "", "", "", "", "", "", "", "", "", ""],
                            ["", "", "", "", "", "", "", "", "", "", "", "", ""],
                            ["", "", "", "", "", "", "", "", "", "", "", "", ""]
                        ],
                        columnWidths: [10, 32, 6, 7, 6, 7, 6, 7, 7, 6, 7, 12, 13]
                    },
                    {
                        name: isLower ? "summary_lower" : "summary_box",
                        type: "text",
                        content: "小計：￥31,000　消費税(10%)：￥3,100",
                        position: { x: 8, y: offsetY + 75 },
                        width: 80,
                        height: 5,
                        fontSize: 8
                    },
                    {
                        name: isLower ? "receipt_lower" : "receipt_box",
                        type: "text",
                        content: "受領印",
                        position: { x: 122, y: offsetY + 74 },
                        width: 18,
                        height: 18,
                        fontSize: 7,
                        alignment: "center",
                        borderWidth: 0.3,
                        borderColor: "#000000"
                    }
                ];
            }

            const upperSchemas = createSectionSchemas(0, false);
            const lowerSchemas = createSectionSchemas(104, true);

            const cutLine = {
                name: "line_cut",
                type: "line",
                position: { x: 5, y: 102 },
                width: 138,
                height: 0,
                color: "#888888"
            };

            const template = {
                basePdf: { width: 148, height: 210, padding: [0, 0, 0, 0] },
                schemas: [[...upperSchemas, cutLine, ...lowerSchemas]]
            };

            const plugins = { text, line, table };

            const options = {
                lang: 'ja'
            };

            const designer = new Designer({ domContainer, template, plugins, options });

            document.getElementById('exportBtn').addEventListener('click', () => {
                const currentTemplate = designer.getTemplate();
                const jsonStr = JSON.stringify(currentTemplate, null, 2);
                const blob = new Blob([jsonStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "delivery_note_template.json";
                a.click();
                URL.revokeObjectURL(url);
            });
        });
    </script>
</body>
</html>

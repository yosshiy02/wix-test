<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出荷納品書 Designer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; font-family: "Noto Sans JP", sans-serif; overflow: hidden; }
    #header { height: 46px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #243447; color: #fff; box-sizing: border-box; }
    #headerActions { display: flex; align-items: center; gap: 8px; }
    #domContainer { height: calc(100vh - 46px); }
    button { border: 1px solid transparent; border-radius: 4px; padding: 8px 14px; color: #fff; background: #1f8f55; cursor: pointer; font-weight: 700; }
    button.secondary { border-color: rgba(255,255,255,.58); background: transparent; }
    button:disabled { cursor: wait; opacity: .65; }
  </style>
</head>
<body>
  <header id="header">
    <strong>出荷納品書 A5縦 PDFME Designer</strong>
    <div id="headerActions">
      <button id="printPreviewBtn" class="secondary" type="button">印刷プレビュー</button>
      <button id="exportBtn" type="button">テンプレートJSONを保存</button>
    </div>
  </header>
  <main id="domContainer"></main>
  <script src="./pdfme-local.bundle.js"></script>
  <script src="./pdfme-shipping-fonts.bundle.js"></script>
  <script>
    (() => {
      "use strict";

      const {
        Designer,
        generate,
        getDynamicTemplate,
        getDynamicHeightsForTable,
        PDFDocument,
        plugins: { text, line, table }
      } = window.PdfmeLocal;
      const fonts = window.PdfmeShippingFonts;
      if (!fonts) throw new Error("Local shipping-note fonts failed to load.");

      const plugins = { text, line, table };
      const MIN_DETAIL_ROWS = 8;
      const CONTINUATION_TABLE_Y = 16;
      const PAGE_CONTENT_BOTTOM = 202;
      const SIDE_SUFFIXES = ["original", "copy"];
      const TEMPLATE_STORAGE_KEY = "hato_shipping_delivery_note_designer_template_v1";
      const TEMPLATE_LAYOUT_VERSION = 4;
      const TEMPLATE_LAYOUT_VERSION_STORAGE_KEY = `${TEMPLATE_STORAGE_KEY}_layout_version`;
      const TEMPLATE_SAVE_DEBOUNCE_MS = 300;
      const FOOTER_NAME_PREFIXES = [
        "remarks_label_", "remarks_", "receiver_label_", "receiver_"
      ];

      // Access「出荷納品書クエリ」へ接続する前段階の正式フィールド構成。
      const shippingNote = {
        出荷納品書ID: "DN-20260802-001",
        出荷納品書年月日: "2026年8月2日",
        得意先名: "株式会社 サンプル商事",
        支店名: "大阪本店",
        出荷納品書摘要: "8月度 出荷分"
      };
      const details = [
        { 商品名: "レディースローファー", 色名: "Black", 納品単価: 4500, 出215: 1, 出220: 2, 出225: 1, 出230: 0, 出235: 0, 出240: 0, 出245: 0, 出250: 0, 出荷納品書明細摘要: "秋冬定番", 出荷納品書明細ID: "1" },
        { 商品名: "レザースニーカー", 色名: "White", 納品単価: 5200, 出215: 0, 出220: 0, 出225: 1, 出230: 1, 出235: 1, 出240: 0, 出245: 0, 出250: 0, 出荷納品書明細摘要: "新作", 出荷納品書明細ID: "2" },
        { 商品名: "ショートブーツ", 色名: "Brown", 納品単価: 6800, 出215: 0, 出220: 0, 出225: 0, 出230: 0, 出235: 1, 出240: 1, 出245: 0, 出250: 0, 出荷納品書明細摘要: "", 出荷納品書明細ID: "3" }
      ];
      const sizeFields = ["出215", "出220", "出225", "出230", "出235", "出240", "出245", "出250"];
      const subtotal = detail => sizeFields.reduce((total, field) => total + Number(detail[field] || 0), 0);
      const numberText = value => Number(value || 0).toLocaleString("ja-JP");
      const yen = value => `¥${numberText(value)}`;
      const clone = value => JSON.parse(JSON.stringify(value));
      const buildTableRows = sourceDetails => sourceDetails.map(detail => {
        const quantity = subtotal(detail);
        const unitPrice = Number(detail["納品単価"] || 0);
        return [
          detail["商品名"],
          detail["色名"],
          ...sizeFields.map(field => Number(detail[field] || 0) === 0 ? "" : String(detail[field])),
          quantity === 0 ? "" : String(quantity),
          numberText(unitPrice),
          quantity === 0 ? "" : numberText(quantity * unitPrice),
          detail["出荷納品書明細摘要"] || ""
        ];
      });
      const fillMinimumRows = rows => [
        ...rows.map(row => [...row]),
        ...Array.from({ length: Math.max(0, MIN_DETAIL_ROWS - rows.length) }, () => Array(14).fill(""))
      ];
      const tableRows = buildTableRows(details);
      const totalAmount = details.reduce((total, detail) => total + subtotal(detail) * Number(detail["納品単価"] || 0), 0);

      function pageSchemas(copyLabel, suffix) {
        const noteText = String(shippingNote["出荷納品書摘要"] || "").trim();
        const detailY = 72;
        const tableHeight = 48;
        const lowerY = 130;
        const copySchemas = copyLabel ? [
          { name: `copy_${suffix}`, type: "text", content: copyLabel, position: { x: 130, y: 10 }, width: 10, height: 6, fontSize: 7.2, fontName: "NotoSansJP", fontColor: "#343b43", alignment: "right" }
        ] : [];

        return [
          { name: `title_${suffix}`, type: "text", content: "出 荷 納 品 書", position: { x: 42, y: 7 }, width: 64, height: 10, fontSize: 16.5, fontName: "YuMinchoDemibold", fontColor: "#20252b", alignment: "center" },
          ...copySchemas,
          { name: `title_rule_${suffix}`, type: "line", position: { x: 8, y: 20 }, width: 132, height: 0.28, color: "#4c535b", readOnly: false },

          { name: `customer_${suffix}`, type: "text", content: String(shippingNote["得意先名"] || ""), position: { x: 8, y: 25 }, width: 75, height: 8, fontSize: 12.5, fontName: "NotoSansJP", fontColor: "#1d2329" },
          { name: `branch_${suffix}`, type: "text", content: `${String(shippingNote["支店名"] || "")}　御中`, position: { x: 8, y: 35 }, width: 75, height: 5, fontSize: 8.6, fontName: "NotoSansJP", fontColor: "#434b54" },

          { name: `document_no_label_${suffix}`, type: "text", content: "納品書 No.", position: { x: 96, y: 24 }, width: 19, height: 5, fontSize: 6.5, fontName: "NotoSansJP", fontColor: "#59616a" },
          { name: `document_no_${suffix}`, type: "text", content: String(shippingNote["出荷納品書ID"] || ""), position: { x: 115, y: 24 }, width: 25, height: 5, fontSize: 8.2, fontName: "NotoSansJP", fontColor: "#252b31", alignment: "right" },
          { name: `document_date_label_${suffix}`, type: "text", content: "伝票日付", position: { x: 96, y: 31 }, width: 19, height: 5, fontSize: 6.5, fontName: "NotoSansJP", fontColor: "#59616a" },
          { name: `document_date_${suffix}`, type: "text", content: String(shippingNote["出荷納品書年月日"] || ""), position: { x: 115, y: 31 }, width: 25, height: 5, fontSize: 8.2, fontName: "NotoSansJP", fontColor: "#252b31", alignment: "right" },
          { name: `document_rule_${suffix}`, type: "line", position: { x: 96, y: 38 }, width: 44, height: 0.18, color: "#c0c5ca", readOnly: false },

          { name: `issuer_name_${suffix}`, type: "text", content: "株式会社ハトダイヤ", position: { x: 87, y: 41 }, width: 53, height: 5, fontSize: 8.4, fontName: "NotoSansJP", fontColor: "#252b31", alignment: "right" },
          { name: `issuer_address_${suffix}`, type: "text", content: "〒544-0011　大阪府大阪市生野区田島6-1-8", position: { x: 84, y: 47 }, width: 56, height: 4, fontSize: 5.8, fontName: "NotoSansJP", fontColor: "#59616a", alignment: "right" },
          { name: `issuer_tel_${suffix}`, type: "text", content: "TEL 06-6754-3511　FAX 06-6754-3513", position: { x: 84, y: 52 }, width: 56, height: 4, fontSize: 5.8, fontName: "NotoSansJP", fontColor: "#59616a", alignment: "right" },
          { name: `issuer_email_${suffix}`, type: "text", content: "E-mail  hato88@axel.ocn.ne.jp", position: { x: 84, y: 57 }, width: 56, height: 4, fontSize: 5.8, fontName: "NotoSansJP", fontColor: "#59616a", alignment: "right" },
          { name: `issuer_registration_${suffix}`, type: "text", content: "登録番号　T0000000000000", position: { x: 84, y: 62 }, width: 56, height: 4, fontSize: 5.6, fontName: "NotoSansJP", fontColor: "#59616a", alignment: "right" },
          { name: `issuer_bank_${suffix}`, type: "text", content: "振込先　○○銀行 ○○支店 普通 0000000", position: { x: 84, y: 67 }, width: 56, height: 4, fontSize: 5.4, fontName: "NotoSansJP", fontColor: "#6b737c", alignment: "right" },
          { name: `upper_total_rule_top_${suffix}`, type: "line", position: { x: 45, y: 46 }, width: 38, height: 0.1, color: "#c7ccd1", readOnly: false },
          { name: `upper_total_label_${suffix}`, type: "text", content: "金額合計", position: { x: 8, y: 49 }, width: 20, height: 6, fontSize: 7.2, fontName: "NotoSansJP", fontColor: "#343b43" },
          { name: `upper_total_value_${suffix}`, type: "text", content: yen(totalAmount), position: { x: 45, y: 47 }, width: 38, height: 9, fontSize: 13.5, fontName: "NotoSansJP", fontColor: "#15191d", alignment: "right" },
          { name: `upper_total_rule_bottom_${suffix}`, type: "line", position: { x: 45, y: 59 }, width: 38, height: 0.18, color: "#69717a", readOnly: false },
          {
            name: `details_${suffix}`, type: "table", position: { x: 8, y: detailY }, width: 132, height: tableHeight,
            showHead: true,
            tableStyles: { borderWidth: 0.2, borderColor: "#858c94" },
            headStyles: {
              fontColor: "#252b31", backgroundColor: "#f5f6f7", fontSize: 6.2, fontName: "NotoSansJP",
              alignment: "center", verticalAlignment: "middle", lineHeight: 1.05, characterSpacing: 0,
              borderColor: "#b6bbc1", borderWidth: { top: 0.1, right: 0.06, bottom: 0.1, left: 0.06 },
              padding: { top: 0.95, right: 0.4, bottom: 0.95, left: 0.4 }
            },
            bodyStyles: {
              fontColor: "#252b31", backgroundColor: "#ffffff", alternateBackgroundColor: "#ffffff", fontSize: 6, fontName: "NotoSansJP",
              alignment: "center", verticalAlignment: "middle", lineHeight: 1.12, characterSpacing: 0,
              borderColor: "#d1d5da", borderWidth: { top: 0.06, right: 0.06, bottom: 0.06, left: 0.06 },
              padding: { top: 1.25, right: 0.5, bottom: 1.25, left: 0.5 }
            },
            head: ["商品名", "色名", "21.5", "22.0\nS", "22.5", "23.0\nM", "23.5", "24.0\nL", "24.5\nLL", "25.0", "小計", "単価", "金額", "明細摘要"],
            content: JSON.stringify(fillMinimumRows(tableRows)),
            headWidthPercentages: [18.8, 8.5, 4.1, 4.1, 4.1, 4.1, 4.1, 4.1, 4.1, 4.1, 5.5, 7.6, 10.5, 16.3],
            columnStyles: { alignment: { 0: "center", 1: "center", 2: "center", 3: "center", 4: "center", 5: "center", 6: "center", 7: "center", 8: "center", 9: "center", 10: "center", 11: "center", 12: "center", 13: "center" } }
          },

          { name: `remarks_label_${suffix}`, type: "text", content: "備考", position: { x: 8, y: lowerY }, width: 14, height: 5, fontSize: 6.5, fontName: "NotoSansJP", fontColor: "#59616a" },
          { name: `remarks_${suffix}`, type: "text", content: noteText, position: { x: 9, y: lowerY + 7 }, width: 92, height: 26, fontSize: 7, fontName: "NotoSansJP", lineHeight: 1.25 },
          { name: `remarks_frame_top_${suffix}`, type: "line", position: { x: 8, y: lowerY + 6 }, width: 94, height: 0.16, color: "#b7bdc3" },
          { name: `remarks_frame_bottom_${suffix}`, type: "line", position: { x: 8, y: lowerY + 34 }, width: 94, height: 0.16, color: "#b7bdc3" },
          { name: `remarks_frame_left_${suffix}`, type: "line", position: { x: 8, y: lowerY + 6 }, width: 0.16, height: 28, color: "#b7bdc3" },
          { name: `remarks_frame_right_${suffix}`, type: "line", position: { x: 101.84, y: lowerY + 6 }, width: 0.16, height: 28, color: "#b7bdc3" },
          { name: `receiver_label_${suffix}`, type: "text", content: "受領印", position: { x: 110, y: lowerY }, width: 30, height: 5, fontSize: 6.5, fontName: "NotoSansJP", fontColor: "#59616a", alignment: "center" },
          { name: `receiver_${suffix}`, type: "text", content: "", position: { x: 111, y: lowerY + 7 }, width: 28, height: 26, fontSize: 7, fontName: "NotoSansJP" },
          { name: `receiver_frame_top_${suffix}`, type: "line", position: { x: 110, y: lowerY + 6 }, width: 30, height: 0.18, color: "#8e969e" },
          { name: `receiver_frame_bottom_${suffix}`, type: "line", position: { x: 110, y: lowerY + 34 }, width: 30, height: 0.18, color: "#8e969e" },
          { name: `receiver_frame_left_${suffix}`, type: "line", position: { x: 110, y: lowerY + 6 }, width: 0.18, height: 28, color: "#8e969e" },
          { name: `receiver_frame_right_${suffix}`, type: "line", position: { x: 139.82, y: lowerY + 6 }, width: 0.18, height: 28, color: "#8e969e" }
        ];
      }

      const standardTemplate = {
        basePdf: { width: 148, height: 210, padding: [16, 8, 8, 8] },
        schemas: [pageSchemas("", "original"), pageSchemas("控", "copy")]
      };

      const findSchemaByName = (sourceTemplate, name) => sourceTemplate.schemas.flat().find(schema => schema.name === name);
      const isFourteenColumnTable = table => {
        try {
          const content = JSON.parse(table.content || "[]");
          return Array.isArray(table.head) && table.head.length === 14 &&
            Array.isArray(table.headWidthPercentages) && table.headWidthPercentages.length === 14 &&
            Array.isArray(content) && content.every(row => Array.isArray(row) && row.length === 14);
        } catch (error) {
          return false;
        }
      };
      function migrateEditableTemplate(savedTemplate, applyCurrentLayout) {
        const savedSchemas = new Map(savedTemplate.schemas.flat().map(schema => [schema.name, schema]));
        let migrated = applyCurrentLayout || savedTemplate.schemas.flat().some(schema => /^(summary_|amount_)/.test(schema.name));
        const migratedTemplate = clone(standardTemplate);
        migratedTemplate.basePdf = clone(savedTemplate.basePdf);
        migratedTemplate.schemas = standardTemplate.schemas.map(page => page.map(standardSchema => {
          const savedSchema = savedSchemas.get(standardSchema.name);
          if (!savedSchema) {
            migrated = true;
            return clone(standardSchema);
          }
          const merged = { ...clone(standardSchema), ...clone(savedSchema), name: standardSchema.name, type: standardSchema.type, content: standardSchema.content };
          if (applyCurrentLayout && standardSchema.name.startsWith("upper_total_")) {
            return savedSchema.id ? { ...clone(standardSchema), id: savedSchema.id } : clone(standardSchema);
          }
          if (standardSchema.type !== "table") return merged;
          const savedIsFourteenColumn = isFourteenColumnTable(savedSchema);
          const layoutKeys = ["id", "position", "width", "height", "showHead", "tableStyles", "headStyles", "bodyStyles", "readOnly", "rotate"];
          layoutKeys.forEach(key => {
            if (savedSchema[key] !== undefined) merged[key] = clone(savedSchema[key]);
          });
          if (savedIsFourteenColumn) {
            merged.headWidthPercentages = clone(savedSchema.headWidthPercentages);
          } else {
            migrated = true;
            merged.headWidthPercentages = clone(standardSchema.headWidthPercentages);
          }
          merged.head = clone(standardSchema.head);
          merged.content = standardSchema.content;
          merged.columnStyles = clone(standardSchema.columnStyles);
          return merged;
        }));
        return { template: migratedTemplate, migrated };
      }

      function isEditableSourceTemplate(candidate) {
        if (!candidate || typeof candidate !== "object" || !candidate.basePdf ||
            !Array.isArray(candidate.schemas) || candidate.schemas.length !== 2 ||
            !candidate.schemas.every(Array.isArray)) return false;
        if (Number(candidate.basePdf.width) !== 148 || Number(candidate.basePdf.height) !== 210) return false;
        const schemas = candidate.schemas.flat();
        const names = new Set(schemas.map(schema => schema && schema.name));
        if (!["title_original", "details_original", "title_copy", "details_copy"].every(name => names.has(name))) return false;
        return !schemas.some(schema => {
          const name = String((schema && schema.name) || "");
          return name.startsWith("continuation_") || name.startsWith("page_number_") ||
            /^details_(original|copy)_page_/.test(name);
        });
      }

      let templateRestoreStatus = "default";
      function loadEditableTemplate() {
        try {
          const savedJson = localStorage.getItem(TEMPLATE_STORAGE_KEY);
          if (!savedJson) return clone(standardTemplate);
          const savedTemplate = JSON.parse(savedJson);
          if (!isEditableSourceTemplate(savedTemplate)) {
            templateRestoreStatus = "invalid";
            console.warn("Saved shipping-note template is not an editable source template; using the standard template.");
            return clone(standardTemplate);
          }
          const savedLayoutVersion = Number(localStorage.getItem(TEMPLATE_LAYOUT_VERSION_STORAGE_KEY) || 0);
          const migration = migrateEditableTemplate(savedTemplate, savedLayoutVersion < TEMPLATE_LAYOUT_VERSION);
          templateRestoreStatus = migration.migrated ? "migrated" : "restored";
          if (migration.migrated) {
            localStorage.setItem(TEMPLATE_STORAGE_KEY, JSON.stringify(migration.template));
            localStorage.setItem(TEMPLATE_LAYOUT_VERSION_STORAGE_KEY, String(TEMPLATE_LAYOUT_VERSION));
          }
          return migration.template;
        } catch (error) {
          templateRestoreStatus = "unavailable";
          console.error("Unable to restore the shipping-note template from local storage.", error);
          return clone(standardTemplate);
        }
      }

      const editableTemplate = loadEditableTemplate();

      const isFooterSchema = (schema, suffix) =>
        schema.name.endsWith(`_${suffix}`) && FOOTER_NAME_PREFIXES.some(prefix => schema.name.startsWith(prefix));
      const findSourcePage = (sourceTemplate, suffix) =>
        sourceTemplate.schemas.find(page => page.some(schema => schema.name === `details_${suffix}`));
      const buildTemplateInput = sourceTemplate => {
        const input = {};
        sourceTemplate.schemas.flat().forEach(schema => { input[schema.name] = schema.content || ""; });
        return input;
      };
      const calculateRowsAmount = rows => rows.reduce((total, row) =>
        total + (Number(String(row[12] || "").replace(/[^0-9.-]/g, "")) || 0), 0);

      async function measureTable(sourceTable, body, basePdf, y) {
        const schema = clone(sourceTable);
        schema.position = { ...schema.position, y };
        schema.content = JSON.stringify(body);
        schema.showHead = true;
        delete schema.__bodyRange;
        delete schema.__isSplit;
        const heights = await getDynamicHeightsForTable(schema.content, {
          schema,
          basePdf,
          options: { font: fonts },
          _cache: new Map()
        });
        return { schema, heights, height: heights.reduce((sum, value) => sum + value, 0) };
      }

      async function splitBodyToFit(sourceTable, body, basePdf, startY, bottomLimit) {
        const measured = await measureTable(sourceTable, body, basePdf, startY);
        const headHeight = measured.heights[0] || 0;
        const bodyHeights = measured.heights.slice(1);
        const chunks = [];
        let offset = 0;
        while (offset < body.length) {
          let height = headHeight;
          let count = 0;
          while (offset + count < body.length && height + bodyHeights[offset + count] <= bottomLimit - startY + 0.001) {
            height += bodyHeights[offset + count];
            count++;
          }
          if (count === 0) count = 1;
          chunks.push(body.slice(offset, offset + count));
          offset += count;
        }
        return chunks;
      }

      function continuationSchemas(sourcePage, suffix, pageNumber) {
        const sourceTitle = sourcePage.find(schema => schema.name === `title_${suffix}`);
        const sourceRule = sourcePage.find(schema => schema.name === `title_rule_${suffix}`);
        const schemas = [
          { ...clone(sourceTitle), name: `continuation_title_${suffix}_${pageNumber}`, position: { x: 42, y: 2 }, width: 64, height: 7, fontSize: 11.5, alignment: "center", readOnly: true },
          { name: `continuation_label_${suffix}_${pageNumber}`, type: "text", content: "明細（続き）", position: { x: 8, y: 6 }, width: 24, height: 4, fontSize: 6.2, fontName: "NotoSansJP", fontColor: "#59616a", readOnly: true },
          { ...clone(sourceRule), name: `continuation_rule_${suffix}_${pageNumber}`, position: { x: 8, y: 13 }, width: 132, height: 0.22, readOnly: true }
        ];
        if (suffix === "copy") {
          schemas.push({ name: `continuation_copy_${pageNumber}`, type: "text", content: "控", position: { x: 130, y: 3 }, width: 10, height: 5, fontSize: 7, fontName: "NotoSansJP", fontColor: "#343b43", alignment: "right", readOnly: true });
        }
        return schemas;
      }

      function addPageNumbers(pages, suffix) {
        const totalPages = pages.length;
        pages.forEach((page, pageIndex) => {
          const currentPage = pageIndex + 1;
          page.push({
            name: `page_number_${suffix}_${currentPage}`,
            type: "text",
            content: `${currentPage} / ${totalPages}`,
            position: { x: 109, y: pageIndex === 0 ? 10 : 3 },
            width: 17,
            height: 5,
            fontSize: 7.2,
            fontName: "NotoSansJP",
            fontColor: "#343b43",
            alignment: "right",
            readOnly: true
          });
        });
      }

      async function createPreparedTable(sourceTable, body, sourceTemplate, y, name) {
        const measured = await measureTable(sourceTable, body, sourceTemplate.basePdf, y);
        return {
          ...measured.schema,
          name,
          height: measured.height,
          content: JSON.stringify(body),
          showHead: true,
          readOnly: true
        };
      }

      async function buildSidePages(sourceTemplate, dynamicTemplate, suffix, displayRows, amount) {
        const sourcePage = findSourcePage(sourceTemplate, suffix);
        if (!sourcePage) throw new Error(`Source page not found: ${suffix}`);
        const sourceTable = sourcePage.find(schema => schema.name === `details_${suffix}`);
        const dynamicPages = dynamicTemplate.schemas.filter(page =>
          page.some(schema => schema.name.endsWith(`_${suffix}`))
        );
        const pages = [];

        for (const dynamicPage of dynamicPages) {
          const dynamicTable = dynamicPage.find(schema => schema.name === `details_${suffix}`);
          if (!dynamicTable) continue;
          const range = dynamicTable.__bodyRange || { start: 0, end: displayRows.length };
          const body = displayRows.slice(range.start || 0, range.end === undefined ? displayRows.length : range.end);
          const beforeSchemas = dynamicPage
            .filter(schema => schema.name !== `details_${suffix}` && !isFooterSchema(schema, suffix))
            .map(schema => ({ ...clone(schema), readOnly: true }));
          const firstOutputPage = pages.length === 0;
          const startY = firstOutputPage ? sourceTable.position.y : CONTINUATION_TABLE_Y;
          const chunks = await splitBodyToFit(sourceTable, body, sourceTemplate.basePdf, startY, PAGE_CONTENT_BOTTOM);

          for (let chunkIndex = 0; chunkIndex < chunks.length; chunkIndex++) {
            const isFirstChunk = chunkIndex === 0;
            const pageNumber = pages.length + 1;
            const pageSchemas = firstOutputPage && isFirstChunk
              ? beforeSchemas
              : continuationSchemas(sourcePage, suffix, pageNumber);
            const y = firstOutputPage && isFirstChunk ? sourceTable.position.y : CONTINUATION_TABLE_Y;
            pageSchemas.push(await createPreparedTable(
              sourceTable,
              chunks[chunkIndex],
              sourceTemplate,
              y,
              `details_${suffix}_page_${pageNumber}`
            ));
            pages.push(pageSchemas);
          }
        }

        if (pages.length === 0) throw new Error(`No detail pages generated: ${suffix}`);

        const sourceFooter = sourcePage.filter(schema => isFooterSchema(schema, suffix));
        const sourceFooterTop = Math.min(...sourceFooter.map(schema => schema.position.y));
        const sourceFooterBottom = Math.max(...sourceFooter.map(schema => schema.position.y + schema.height));
        const footerSpan = sourceFooterBottom - sourceFooterTop;
        const sourceGap = sourceFooterTop - (sourceTable.position.y + sourceTable.height);

        while (true) {
          const lastPage = pages[pages.length - 1];
          const lastTableIndex = lastPage.findIndex(schema => schema.name.startsWith(`details_${suffix}_page_`));
          const lastTable = lastPage[lastTableIndex];
          const desiredFooterTop = lastTable.position.y + lastTable.height + sourceGap;
          if (desiredFooterTop + footerSpan <= PAGE_CONTENT_BOTTOM + 0.001) break;
          const lastBody = JSON.parse(lastTable.content || "[]");
          if (lastBody.length <= 1) throw new Error(`Footer cannot fit with final detail row: ${suffix}`);
          const moveCount = Math.min(lastBody.length - 1, Math.max(1, Math.ceil(lastBody.length * 0.35)));
          const retainedBody = lastBody.slice(0, lastBody.length - moveCount);
          const movedBody = lastBody.slice(lastBody.length - moveCount);
          lastPage[lastTableIndex] = await createPreparedTable(
            sourceTable,
            retainedBody,
            sourceTemplate,
            lastTable.position.y,
            lastTable.name
          );
          const pageNumber = pages.length + 1;
          const newPage = continuationSchemas(sourcePage, suffix, pageNumber);
          newPage.push(await createPreparedTable(
            sourceTable,
            movedBody,
            sourceTemplate,
            CONTINUATION_TABLE_Y,
            `details_${suffix}_page_${pageNumber}`
          ));
          pages.push(newPage);
        }

        const finalPage = pages[pages.length - 1];
        const finalTable = finalPage.find(schema => schema.name.startsWith(`details_${suffix}_page_`));
        const footerTop = finalTable.position.y + finalTable.height + sourceGap;
        const footerOffset = footerTop - sourceFooterTop;
        sourceFooter.forEach(schema => {
          const prepared = clone(schema);
          prepared.position = { ...prepared.position, y: prepared.position.y + footerOffset };
          prepared.readOnly = true;
          finalPage.push(prepared);
        });

        addPageNumbers(pages, suffix);
        return pages;
      }

      async function preparePagedTemplate(sourceTemplate, rows) {
        const workingTemplate = clone(sourceTemplate);
        workingTemplate.basePdf = { ...workingTemplate.basePdf, padding: [16, 8, 8, 8] };
        const displayRows = fillMinimumRows(rows);
        const amount = calculateRowsAmount(rows);
        SIDE_SUFFIXES.forEach(suffix => {
          const sourcePage = findSourcePage(workingTemplate, suffix);
          const sourceTable = sourcePage && sourcePage.find(schema => schema.name === `details_${suffix}`);
          const upperTotal = sourcePage && sourcePage.find(schema => schema.name === `upper_total_value_${suffix}`);
          if (!sourceTable || !upperTotal) throw new Error(`Editable table or upper total schema not found: ${suffix}`);
          sourceTable.content = JSON.stringify(displayRows);
          upperTotal.content = yen(amount);
        });
        const dynamicTemplate = await getDynamicTemplate({
          template: workingTemplate,
          input: buildTemplateInput(workingTemplate),
          options: { font: fonts },
          _cache: new Map(),
          getDynamicHeights: (value, args) => getDynamicHeightsForTable(value, args)
        });
        const originalPages = await buildSidePages(workingTemplate, dynamicTemplate, "original", displayRows, amount);
        const copyPages = await buildSidePages(workingTemplate, dynamicTemplate, "copy", displayRows, amount);
        const prepared = {
          basePdf: { ...workingTemplate.basePdf, padding: [0, 0, 0, 0] },
          schemas: [...originalPages, ...copyPages]
        };
        prepared.schemas.forEach(page => page.forEach(schema => { schema.readOnly = true; }));
        return prepared;
      }

      const designer = new Designer({
        domContainer: document.getElementById("domContainer"),
        template: editableTemplate,
        plugins,
        options: { lang: "ja", font: fonts }
      });
      document.body.dataset.templateRestoreStatus = templateRestoreStatus;

      let templateSaveTimer = null;
      function saveEditableTemplate() {
        try {
          const currentTemplate = designer.getTemplate();
          if (!isEditableSourceTemplate(currentTemplate)) {
            document.body.dataset.templateStorageStatus = "rejected";
            console.error("Expanded or invalid template was rejected from local storage.");
            return false;
          }
          localStorage.setItem(TEMPLATE_STORAGE_KEY, JSON.stringify(currentTemplate));
          localStorage.setItem(TEMPLATE_LAYOUT_VERSION_STORAGE_KEY, String(TEMPLATE_LAYOUT_VERSION));
          document.body.dataset.templateStorageStatus = "saved";
          document.body.dataset.templateSavedAt = new Date().toISOString();
          return true;
        } catch (error) {
          document.body.dataset.templateStorageStatus = "error";
          console.error("Unable to save the shipping-note template to local storage.", error);
          return false;
        }
      }

      designer.onChangeTemplate(() => {
        if (templateSaveTimer !== null) clearTimeout(templateSaveTimer);
        document.body.dataset.templateStorageStatus = "pending";
        templateSaveTimer = setTimeout(() => {
          templateSaveTimer = null;
          saveEditableTemplate();
        }, TEMPLATE_SAVE_DEBOUNCE_MS);
      });

      window.addEventListener("beforeunload", () => {
        if (templateSaveTimer === null) return;
        clearTimeout(templateSaveTimer);
        templateSaveTimer = null;
        saveEditableTemplate();
      });

      async function createPreviewPdf(sourceTemplate, rows) {
        const preparedTemplate = await preparePagedTemplate(sourceTemplate, rows);
        const pdf = await generate({
          template: preparedTemplate,
          inputs: [{}],
          plugins,
          options: { font: fonts }
        });
        return { preparedTemplate, pdf };
      }

      const printPreviewBtn = document.getElementById("printPreviewBtn");
      printPreviewBtn.addEventListener("click", async () => {
        const previewTab = window.open("about:blank", "_blank");
        if (!previewTab) {
          alert("印刷プレビューを開けませんでした。ポップアップを許可してください。");
          return;
        }
        const originalLabel = printPreviewBtn.textContent;
        printPreviewBtn.disabled = true;
        printPreviewBtn.textContent = "PDF作成中…";
        try {
          const { pdf } = await createPreviewPdf(designer.getTemplate(), tableRows);
          const url = URL.createObjectURL(new Blob([pdf], { type: "application/pdf" }));
          previewTab.location.href = url;
          setTimeout(() => URL.revokeObjectURL(url), 300000);
        } catch (error) {
          previewTab.close();
          console.error(error);
          alert(`印刷プレビューの作成に失敗しました。\n${error.message || error}`);
        } finally {
          printPreviewBtn.disabled = false;
          printPreviewBtn.textContent = originalLabel;
        }
      });

      document.getElementById("exportBtn").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(designer.getTemplate(), null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = Object.assign(document.createElement("a"), { href: url, download: "shipping_delivery_note_a5_template.json" });
        link.click();
        URL.revokeObjectURL(url);
      });

      const createTestRows = count => Array.from({ length: count }, (_, index) => {
        const row = [...tableRows[index % tableRows.length]];
        row[0] = `${row[0]} ${index + 1}`;
        return row;
      });

      async function runPaginationAudit() {
        const results = [];
        const expectedHeaders = ["商品名", "色名", "21.5", "22.0\nS", "22.5", "23.0\nM", "23.5", "24.0\nL", "24.5\nLL", "25.0", "小計", "単価", "金額", "明細摘要"];
        const expectedRemarks = String(shippingNote["出荷納品書摘要"] || "").trim();
        for (const count of [3, 8, 12, 20]) {
          const rows = createTestRows(count);
          const expectedAmount = yen(calculateRowsAmount(rows));
          const { preparedTemplate, pdf } = await createPreviewPdf(designer.getTemplate(), rows);
          const pdfDocument = await PDFDocument.load(pdf);
          const audit = { details: count, pages: preparedTemplate.schemas.length, pdfPages: pdfDocument.getPageCount() };
          for (const suffix of SIDE_SUFFIXES) {
            const pageIndexes = [];
            let actualRows = 0;
            let finalTablePage = -1;
            const footerPages = new Set();
            preparedTemplate.schemas.forEach((page, pageIndex) => {
              const tableSchema = page.find(schema => schema.name.startsWith(`details_${suffix}_page_`));
              if (tableSchema) {
                pageIndexes.push(pageIndex);
                finalTablePage = pageIndex;
                if (!Array.isArray(tableSchema.head) || tableSchema.head.length !== 14 ||
                    tableSchema.head.join("\u0000") !== expectedHeaders.join("\u0000")) {
                  throw new Error(`Fourteen-column header mismatch: ${suffix}/${count}`);
                }
                const widths = tableSchema.headWidthPercentages || [];
                if (widths.length !== 14 || Math.abs(widths.reduce((sum, width) => sum + Number(width), 0) - 100) > 0.001) {
                  throw new Error(`Fourteen-column width mismatch: ${suffix}/${count}`);
                }
                const expectedCenterAlignment = Array.from({ length: 14 }, (_, index) => index).every(index => tableSchema.columnStyles && tableSchema.columnStyles.alignment && tableSchema.columnStyles.alignment[index] === "center");
                if (!expectedCenterAlignment) throw new Error(`Table body alignment mismatch: ${suffix}/${count}`);
                const body = JSON.parse(tableSchema.content || "[]");
                body.forEach(row => {
                  if (!Array.isArray(row) || row.length !== 14) throw new Error(`Fourteen-column body mismatch: ${suffix}/${count}`);
                  if (row.some(cell => String(cell || "").trim() !== "")) {
                    const lineSubtotal = Number(String(row[10] || "").replace(/[^0-9.-]/g, "")) || 0;
                    const unitPrice = Number(String(row[11] || "").replace(/[^0-9.-]/g, "")) || 0;
                    if (String(row[11] || "").includes("¥") || String(row[12] || "").includes("¥")) {
                      throw new Error(`Detail unit price or amount still contains yen marker: ${suffix}/${count}`);
                    }
                    if (String(row[12] || "") !== numberText(lineSubtotal * unitPrice)) {
                      throw new Error(`Line amount mismatch: ${suffix}/${count}`);
                    }
                    actualRows++;
                  }
                });
                if (!tableSchema.showHead) throw new Error(`Missing continuation table header: ${suffix}/${count}`);
              }
              if (page.some(schema => isFooterSchema(schema, suffix))) footerPages.add(pageIndex);
            });
            if (actualRows !== count) throw new Error(`Detail loss detected: ${suffix}/${count}/${actualRows}`);
            if (footerPages.size !== 1 || !footerPages.has(finalTablePage)) throw new Error(`Footer is not on the final detail page: ${suffix}/${count}`);
            const firstTablePage = pageIndexes[0];
            const upperTotalPages = preparedTemplate.schemas
              .map((page, pageIndex) => page.some(schema => schema.name === `upper_total_value_${suffix}`) ? pageIndex : -1)
              .filter(pageIndex => pageIndex >= 0);
            const upperTotal = preparedTemplate.schemas[firstTablePage].find(schema => schema.name === `upper_total_value_${suffix}`);
            if (upperTotalPages.length !== 1 || upperTotalPages[0] !== firstTablePage || !upperTotal || upperTotal.content !== expectedAmount) {
              throw new Error(`Upper total placement or amount mismatch: ${suffix}/${count}`);
            }
            const dateLabel = preparedTemplate.schemas[firstTablePage].find(schema => schema.name === `document_date_label_${suffix}`);
            if (!dateLabel || dateLabel.content !== "伝票日付") throw new Error(`Document date label mismatch: ${suffix}/${count}`);
            const expectedPageTotal = pageIndexes.length;
            const pageNumbers = pageIndexes.map((pageIndex, sidePageIndex) => {
              const expectedContent = `${sidePageIndex + 1} / ${expectedPageTotal}`;
              const pageNumber = preparedTemplate.schemas[pageIndex].find(
                schema => schema.name === `page_number_${suffix}_${sidePageIndex + 1}`
              );
              if (!pageNumber || pageNumber.content !== expectedContent) {
                throw new Error(`Page number mismatch: ${suffix}/${count}/${expectedContent}`);
              }
              return pageNumber.content;
            });
            for (const continuationPageIndex of pageIndexes.slice(1)) {
              const continuationPage = preparedTemplate.schemas[continuationPageIndex];
              if (!continuationPage.some(schema => schema.name.startsWith(`continuation_title_${suffix}_`)) ||
                  !continuationPage.some(schema => schema.name.startsWith(`continuation_label_${suffix}_`))) {
                throw new Error(`Continuation heading is missing: ${suffix}/${count}/${continuationPageIndex}`);
              }
              if (suffix === "copy" && !continuationPage.some(schema => schema.content === "控")) {
                throw new Error(`Copy marker is missing on continuation page: ${count}/${continuationPageIndex}`);
              }
            }
            for (const finalName of [`remarks_${suffix}`, `receiver_${suffix}`]) {
              const matchingPages = preparedTemplate.schemas
                .map((page, pageIndex) => page.some(schema => schema.name === finalName) ? pageIndex : -1)
                .filter(pageIndex => pageIndex >= 0);
              if (matchingPages.length !== 1 || matchingPages[0] !== finalTablePage) {
                throw new Error(`Final-page schema placement is invalid: ${finalName}/${count}`);
              }
            }
            const finalRemarks = preparedTemplate.schemas[finalTablePage].find(schema => schema.name === `remarks_${suffix}`);
            if (!finalRemarks || finalRemarks.content !== expectedRemarks) throw new Error(`Remarks content mismatch: ${suffix}/${count}`);
            audit[`${suffix}Pages`] = pageIndexes.length;
            audit[`${suffix}Rows`] = actualRows;
            audit[`${suffix}PageNumbers`] = pageNumbers;
            audit[`${suffix}Amount`] = expectedAmount;
          }
          if (audit.originalRows !== audit.copyRows) throw new Error(`Original/copy mismatch: ${count}`);
          if (audit.pages !== audit.pdfPages) throw new Error(`Prepared/PDF page mismatch: ${count}`);
          const renderedSchemas = preparedTemplate.schemas.flat();
          if (renderedSchemas.some(schema => /^(summary_|amount_)/.test(schema.name))) throw new Error("Legacy summary or lower-total schema remains.");
          const renderedText = renderedSchemas.map(schema => String(schema.content || "")).join("\n");
          if (renderedText.includes("正")) throw new Error("The prohibited original-side label remains.");
          if (!renderedText.includes("控")) throw new Error("The copy label is missing.");
          if (renderedText.includes("□")) throw new Error("Unsupported Japanese glyph marker was detected.");
          if (count === 20) document.body.dataset.paginationAuditTemplate = JSON.stringify(preparedTemplate);
          results.push(audit);
        }
        document.body.dataset.paginationAudit = JSON.stringify(results);
        document.body.dataset.paginationAuditStatus = "PASS";
        return results;
      }

      window.ShippingDeliveryNoteApp = Object.freeze({
        designer,
        preparePagedTemplate,
        createPreviewPdf,
        createTestRows,
        runPaginationAudit
      });

      if (location.hash === "#pdfme-pagination-audit") {
        runPaginationAudit().catch(error => {
          console.error(error);
          document.body.dataset.paginationAuditStatus = `FAIL: ${error.message || error}`;
        });
      }
    })();
  </script>
</body>


<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HD ORIGIN | Brand Shop</title>
<style>
html,body {
  margin:0;
  min-height:100%;
  background:#f4f4f4;
}
</style>
</head>
<body>

<hd-brand-shop></hd-brand-shop>

<script>
class HdBrandShop extends HTMLElement {

  constructor() {
    super();
    this.attachShadow({mode:"open"});

    // ========================================
    // ブランド設定
    // ========================================
    this.brands = [
      {
        id:"sungenova",
        name:"SUNGENOVA",
        short:"NATURAL COMFORT",
        background:"#eee7da",
        accent:"#76634a",
        colors:["#d3b58e","#ae875a","#e8dcca"],
        description:"自然体で、心地よい毎日を。"
      },
      {
        id:"lunafit",
        name:"LUNA FIT",
        short:"ACTIVE MOVEMENT",
        background:"#0960d5",
        accent:"#0877ef",
        colors:["#82e6fa","#236be9","#152947"],
        description:"自由な一歩を、もっと軽快に。"
      },
      {
        id:"reina",
        name:"REINA",
        short:"TIMELESS ELEGANCE",
        background:"#472638",
        accent:"#95536f",
        colors:["#dfb3c4","#79394f","#e7d9d4"],
        description:"日常に、優雅さを。"
      },
      {
        id:"moca",
        name:"MOCA WALK",
        short:"SLOW LIVING",
        background:"#d6d0b9",
        accent:"#66704c",
        colors:["#bba67e","#6c7650","#ebe1c6"],
        description:"自然体で楽しむ、日々の暮らし。"
      },
      {
        id:"urban",
        name:"URBAN STEP",
        short:"CITY CULTURE",
        background:"#171717",
        accent:"#f26441",
        colors:["#e3e3e3","#585858","#fc6a43"],
        description:"都市を、自分のスタイルで。"
      }
    ];

    // ========================================
    // 模擬商品データ
    // ========================================
    const names = {
      sungenova:[
        "Natural Comfort",
        "Daily Soft",
        "Relax Walk"
      ],
      lunafit:[
        "Motion Air",
        "Velocity",
        "Active Flex"
      ],
      reina:[
        "Grace",
        "Elegant Mary Jane",
        "Royal Classic"
      ],
      moca:[
        "Craft Walker",
        "Soft Loafer",
        "Natural Step"
      ],
      urban:[
        "City Motion",
        "Mono Runner",
        "Street Form"
      ]
    };

    this.products = [];

    this.brands.forEach((brand,bi)=>{
      Array.from({length:20},(_,i)=>{
  const name=names[brand.id][i%names[brand.id].length]+" "+String(i+1).padStart(2,"0");
        this.products.push({
          id:String((bi+1)*100+i+1),
          brand:brand.id,
          name:name,
          category:[
            "コンフォート",
            "カジュアル",
            "ウォーキング"
          ][i%3],
          price:5900+bi*550+i*400,
          colors:[
            "ブラック",
            "キャメル",
            "ライトグレー"
          ],
          sizes:[
            "22.5","23.0","23.5",
            "24.0","24.5"
          ],
          shape:i,
          description:
            `${name}は、${brand.description}`+
            "毎日の装いに合わせやすいデザインを"+
            "イメージした模擬商品です。",
          material:"未設定（模擬商品）",
          origin:"未設定（模擬商品）",
          care:"素材に応じたお手入れ方法を掲載予定です。"
        });
      });
    });

    // ========================================
    // 状態管理
    // ========================================
    this.current = "sungenova";

    this.category = "すべて";
    this.filterColor = "すべて";
    this.filterSize = "すべて";
    this.catalogLevel = "items";
    this.selectedItemId = null;
    this.catalogTransition = "";
    this.catalogIsTransitioning = false;
    this.catalogAnimationTimer = null;
    this.catalogOutgoingMarkup = "";

    this.cart = [];
    this.activeProduct = null;

    this.selectedColor = 0;
    this.selectedSize = "23.5";
    this.quantity = 1;

    // 購入・商品説明タブ
    this.detailTab = "buy";

    this.menuOpen = false;
    this.modalOpen = false;
    this.modalAnimationTimer = null;
    this.sideCartOpen = false;
  }

  connectedCallback() {
    this.render();

    this.keyHandler = e => {
      if(e.key==="Escape" && this.modalOpen) {
        this.closeModal();
      }
    };

    document.addEventListener(
      "keydown",this.keyHandler
    );
  }

  disconnectedCallback() {
    document.removeEventListener(
      "keydown",this.keyHandler
    );
  }

  get brand() {
    return this.brands.find(
      b=>b.id===this.current
    );
  }

  money(value) {
    return "¥"+value.toLocaleString("ja-JP");
  }

  colorCode(color) {
    return {
      "ブラック":"#292929",
      "キャメル":"#bd8953",
      "ライトグレー":"#b8b8b8"
    }[color] || "#888";
  }

  // ========================================
  // 模擬商品画像SVG
  // ========================================
  shoe(color,shape=0) {
    const c=this.colorCode(color);
    const sole=shape===1?"#fff":"#e7e0d7";

    const svg=`
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 600 400">
      <rect width="600" height="400"
            fill="#f2f0ed"/>
      <ellipse cx="300" cy="326"
               rx="220" ry="15"
               fill="#d8d4cd"/>
      <path d="
        M70 267
        Q110 218 177 220
        L242 135
        Q272 111 315 145
        L391 219
        Q447 249 512 270
        Q544 283 524 310
        L115 323
        Q66 315 70 267Z"
        fill="${c}"
        stroke="#666"
        stroke-width="3"/>
      <path d="M77 306 Q281 346 525 298"
        fill="none"
        stroke="${sole}"
        stroke-width="${shape===1?23:15}"/>
      <path d="M217 223 L389 223"
        stroke="#ddd"
        stroke-width="7"/>
      <path d="M251 152 L363 219"
        stroke="#ddd"
        stroke-width="5"/>
    </svg>`;

    return "data:image/svg+xml;charset=utf-8,"+
      encodeURIComponent(svg);
  }

  // ========================================
  // ブランドバナー画像
  // ========================================
  bannerArt(brand,index) {
    const [a,c,d]=brand.colors;

    const patterns=[
      `<circle cx="260" cy="105" r="115"
        fill="${d}" opacity=".8"/>
       <path d="M30 270 Q130 80 350 210"
        stroke="${c}" stroke-width="20"
        fill="none" opacity=".35"/>`,

      `<path d="M-80 290 L260 -50
        L430 30 L90 370Z"
        fill="${a}" opacity=".8"/>
       <path d="M130 350 L440 40"
        stroke="white" stroke-width="28"
        opacity=".25"/>`,

      `<circle cx="180" cy="170" r="125"
        fill="none" stroke="${a}"
        stroke-width="2"/>
       <path d="M60 265 Q190 10 340 260"
        fill="none" stroke="${a}"
        stroke-width="3"/>`,

      `<path d="M0 270 L350 60
        L350 350 L0 350Z"
        fill="${d}" opacity=".6"/>
       <circle cx="260" cy="95" r="70"
        fill="${a}" opacity=".6"/>`,

      `<path d="M0 0 L120 0
        L350 350 L230 350Z"
        fill="${c}"/>
       <path d="M260 0 L350 0
        L90 350 L0 350Z"
        fill="${d}" opacity=".7"/>`
    ];

    const svg=`
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 350 350">
      <rect width="350" height="350"
        fill="${brand.background}"/>
      ${patterns[index]}
      <text x="175" y="190"
        text-anchor="middle"
        fill="${index===1||index===4
          ?"white":brand.accent}"
        font-family="Arial"
        font-size="35"
        font-weight="bold"
        opacity=".4">
        ${String(index+1).padStart(2,"0")}
      </text>
    </svg>`;

    return "data:image/svg+xml;charset=utf-8,"+
      encodeURIComponent(svg);
  }

  // ========================================
  // 商品絞り込み
  // ========================================
  filtered() {
    return this.products.filter(p=>
      p.brand===this.current &&
      (
        this.category==="すべて" ||
        p.category===this.category
      ) &&
      (
        this.filterColor==="すべて" ||
        p.colors.includes(this.filterColor)
      ) &&
      (
        this.filterSize==="すべて" ||
        p.sizes.includes(this.filterSize)
      )
    );
  }

  selectedItem() {
    return this.products.find(
      p=>p.id===this.selectedItemId &&
      p.brand===this.current
    );
  }

  catalogNavigation() {
    const item=this.selectedItem();

    if(!item || this.catalogLevel!=="colors") return "";

    return `
      <button class="catalog-back"
              id="catalogBack"
              type="button">
        ← アイテム一覧へ戻る
      </button>
      <p class="catalog-current-item">
        ${item.name} / COLOR VARIATIONS
      </p>
    `;
  }

  catalogClass() {
    return this.catalogTransition
      ?`catalog ${this.catalogTransition}`
      :"catalog";
  }

  catalogMenu() {
    const item=this.selectedItem();
    const items=this.filtered();

    if(this.catalogLevel==="colors" && item) {
      return `
        <div class="catalog-menu catalog-menu-colors">
          <div class="menu-path">${this.brand.name} / ${item.name}</div>
          <button class="menu-back"
                  data-catalog-menu-back
                  type="button">← アイテム一覧</button>
          <div class="menu-items">
            ${item.colors.map((color,index)=>`
              <button class="menu-item
                ${this.selectedColor===index?"active":""}"
                data-product="${item.id}"
                style="--menu-index:${index}"
                data-color-index="${index}"
                type="button">
                <span class="menu-swatch"
                      style="background:${this.colorCode(color)}"></span>
                ${color}
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }

    return `
      <div class="catalog-menu catalog-menu-items">
        <div class="menu-path">${this.brand.name} / ${this.category}</div>
        <div class="menu-items">
          ${items.map((p,index)=>`
            <button class="menu-item"
                    style="--menu-index:${Math.min(index,4)}"
                    data-item="${p.id}"
                    type="button">
              ${p.name}
            </button>
          `).join("")}
        </div>
      </div>
    `;
  }
  mountOutgoingCatalogLayer() {
    if(!this.catalogOutgoingMarkup) return;

    const catalog=this.shadowRoot.querySelector(".catalog");
    if(!catalog) return;

    const documentRef=this.shadowRoot.ownerDocument;
    const outgoing=documentRef.createElement("div");
    const incoming=documentRef.createElement("div");

    outgoing.className="catalog-outgoing";
    incoming.className="catalog-incoming";
    outgoing.innerHTML=this.catalogOutgoingMarkup;
    outgoing.querySelectorAll(".catalog-incoming").forEach(layer=>{
      layer.classList.remove("catalog-incoming");
    });

    while(catalog.firstChild) {
      incoming.appendChild(catalog.firstChild);
    }

    catalog.append(outgoing,incoming);
  }

  transitionCatalog(nextLevel,itemId,trigger) {
    if(this.catalogIsTransitioning) return;

    const isReducedMotion=window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;
    const direction=nextLevel==="colors" ?"forward":"back";

    if(isReducedMotion) {
      this.catalogLevel=nextLevel;
      this.selectedItemId=itemId;
      this.render();
      return;
    }

    this.catalogIsTransitioning=true;
    this.catalogOutgoingMarkup="";
    if(trigger) trigger.classList.add("is-selected");

    const catalog=this.shadowRoot.querySelector(".catalog");
    if(catalog) catalog.classList.add(
      `catalog-leave-${direction}`
    );

    window.setTimeout(()=>{
      this.catalogOutgoingMarkup=catalog ?catalog.innerHTML:"";
      this.catalogLevel=nextLevel;
      this.selectedItemId=itemId;
      this.catalogTransition=`catalog-enter-${direction}`;
      this.render();
      this.mountOutgoingCatalogLayer();

      this.catalogAnimationTimer=window.setTimeout(()=>{
        const activeCatalog=this.shadowRoot.querySelector(".catalog");

        if(activeCatalog) {
          const outgoing=activeCatalog.querySelector(
            ".catalog-outgoing"
          );
          const incoming=activeCatalog.querySelector(
            ".catalog-incoming"
          );

          // Keep the incoming wrapper in place so the final layout tree
          // is identical to the animated layout. Only the old layer and
          // animation class are removed; no reparenting or reflow is done.
          if(outgoing) outgoing.remove();

          activeCatalog.classList.remove(
            "catalog-enter-forward","catalog-enter-back"
          );
        }

        this.catalogTransition="";
        this.catalogOutgoingMarkup="";
        this.catalogIsTransitioning=false;
      },1700);
    },560);
  }

  // ========================================
  // 商品一覧カード
  // ========================================
  productCards() {
    const item=this.selectedItem();

    if(this.catalogLevel==="colors" && item) {
      return item.colors
        .filter(color=>
          this.filterColor==="すべて" ||
          color===this.filterColor
        )
        .map(color=>({
          color,
          colorIndex:item.colors.indexOf(color)
        }))
        .map(({color,colorIndex},index)=>`
          <button class="product-card"
                  style="--catalog-card-index:${Math.min(index,3)}"
                  data-product="${item.id}"
                  data-color-index="${colorIndex}">
            <div class="product-photo">
              <img
                src="${this.shoe(color,item.shape)}"
                alt="${item.name} / ${color}">
            </div>

            <div class="product-text">
              <small>NO. ${item.id} / ${color}</small>
              <h3>${item.name}</h3>
              <p>${this.money(item.price)}</p>
              <span>VIEW PRODUCT →</span>
            </div>
          </button>
        `).join("") ||
        `<p class="empty">
           該当するカラーの商品はありません。
         </p>`;
    }

    return this.filtered().map((p,index)=>`
      <button class="product-card"
              style="--catalog-card-index:${Math.min(index,3)}"
              data-item="${p.id}">
        <div class="product-photo">
          <img
            src="${this.shoe(p.colors[0],p.shape)}"
            alt="${p.name}">
        </div>

        <div class="product-text">
          <small>NO. ${p.id}</small>
          <h3>${p.name}</h3>
          <p>${this.money(p.price)}</p>
          <span>VIEW COLORS →</span>
        </div>
      </button>
    `).join("") ||
    `<p class="empty">
       該当する商品はありません。
     </p>`;
  }

  // ========================================
  // ブランドごとのデザイン
  // ========================================
  brandPage() {
    const cards=this.productCards();
    const navigation=this.catalogNavigation();
    const catalogClass=this.catalogClass();

    switch(this.current) {

      // SUNGENOVA
      case "sungenova":
        return `
        <div class="world natural">
          <section class="natural-hero">
            <div>
              <small>THE COMFORT COLLECTION</small>
              <h1>Natural<br>Comfort.</h1>
              <p>心地よさを、日常に。</p>
              <div class="line"></div>
              <span>
                静かに、やさしく、
                毎日に寄り添う。
              </span>
            </div>

            <div class="natural-feature">
              <div class="natural-sun"></div>
              <img src="${this.shoe("キャメル")}">
            </div>
          </section>

          <section class="${catalogClass}">
            ${navigation}
            <div class="natural-heading">
              <small>01 / OUR COLLECTION</small>
              <h2>Everyday Essentials</h2>
            </div>
            <div class="product-grid">
              ${cards}
            </div>
          </section>
        </div>`;

      // LUNA FIT
      case "lunafit":
        return `
        <div class="world sport">
          <section class="sport-hero">
            <div class="speed-lines"></div>
            <small>
              PERFORMANCE / COLLECTION 026
            </small>
            <h1>MOVE<br><em>BEYOND.</em></h1>
            <img class="sport-shoe"
              src="${this.shoe("ライトグレー",1)}">
            <strong>
              YOUR NEXT STEP STARTS HERE →
            </strong>
          </section>

          <section class="${catalogClass}">
            ${navigation}
            <h2>GEAR / 01</h2>
            <div class="product-grid">
              ${cards}
            </div>
          </section>
        </div>`;

      // REINA
      case "reina":
        return `
        <div class="world elegant">
          <section class="elegant-hero">
            <small>
              MAISON REINA — 2026 COLLECTION
            </small>

            <div class="elegant-frame">
              <div class="ornament">✦</div>
              <h1>REINA</h1>
              <p>Elegance is timeless.</p>
              <img src="${this.shoe("ブラック")}">
            </div>

            <span>
              A quiet expression of beauty
            </span>
          </section>

          <section class="${catalogClass}">
            ${navigation}
            <div class="elegant-heading">
              <small>THE EDITION</small>
              <h2>Objects of Desire</h2>
              <div class="fine-line"></div>
            </div>
            <div class="product-grid">
              ${cards}
            </div>
          </section>
        </div>`;

      // MOCA WALK
      case "moca":
        return `
        <div class="world craft">
          <section class="craft-hero">
            <div class="craft-stamp">
              NATURAL GOODS<br>EST. 2026
            </div>

            <div class="craft-title">
              <small>
                THE DAILY GOODS / MOCA WALK
              </small>
              <h1>
                Slow down.<br>Walk more.
              </h1>
              <p>歩くことを、楽しむ。</p>
            </div>

            <div class="craft-photo">
              <img src="${this.shoe("キャメル")}">
            </div>
          </section>

          <section class="${catalogClass}">
            ${navigation}
            <h2>Our favorite things.</h2>
            <p>
              日常に溶け込む、
              自然体のシューズ。
            </p>
            <div class="product-grid">
              ${cards}
            </div>
          </section>
        </div>`;

      // URBAN STEP
      default:
        return `
        <div class="world urban">
          <section class="urban-hero">
            <div class="urban-meta">
              <span>URBAN STEP®</span>
              <span>TOKYO / 2026</span>
            </div>

            <h1>
              NO<br>LIMITS<span>.</span>
            </h1>

            <div class="urban-graphic">
              <img src="${this.shoe("ブラック",1)}">
            </div>

            <div class="urban-caption">
              <strong>THE CITY EDIT</strong>
              <small>
                FORM FOLLOWS MOVEMENT.
              </small>
            </div>
          </section>

          <section class="${catalogClass}">
            ${navigation}
            <h2>01 / SELECTED OBJECTS</h2>
            <div class="product-grid">
              ${cards}
            </div>
          </section>
        </div>`;
    }
  }

  // ========================================
  // メイン描画
  // ========================================
  render() {
    const cartCount=this.cart.reduce(
      (sum,p)=>sum+p.qty,0
    );

    this.shadowRoot.innerHTML=`
    <style>
      * { box-sizing:border-box; }

      :host {
        display:block;
        width:100%;
        font-family:Arial,"Noto Sans JP",sans-serif;
        color:#222;
      }

      button,input,select { font:inherit; }
      button { cursor:pointer; }
      img { max-width:100%; }

      [hidden] { display:none!important; }

      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline:3px solid #478ada;
        outline-offset:3px;
      }

      /* ====================================
         ヘッダー
      ==================================== */
      .topbar {
        height:72px;
position:sticky;
top:0;
z-index:102;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 4%;
        border-bottom:1px solid #ddd;
      }

      .logo {
        font-size:22px;
        letter-spacing:4px;
        font-weight:bold;
      }

      .head-actions {
        display:flex;
        gap:10px;
      }

      .outline {
        border:1px solid #ddd;
        background:white;
        padding:10px 16px;
      }

      #menuToggle { display:none; }

      /* ====================================
         ブランドバナーメニュー
      ==================================== */
      .banner-menu {
  position:sticky;
  top:0;
  z-index:100;
        display:grid;
        grid-template-columns:
          repeat(5,minmax(0,1fr));
        gap:3px;
        background:#171717;
        padding:3px;
      }

      .banner {
        position:relative;
        min-width:0;
        height:70px;
        overflow:hidden;
        border:0;
        padding:0;
        background:#222;
        color:white;
        isolation:isolate;
      }

      .banner img {
        width:100%;
        height:100%;
        object-fit:cover;
        display:block;
        transition:
          transform .6s ease,
          filter .5s;
        filter:brightness(.78);
      }

      .banner:hover img {
        transform:scale(1.15);
        filter:brightness(.55);
      }

      .banner:after {
        content:"";
        position:absolute;
        inset:0;
        background:linear-gradient(
          transparent 20%,#0009
        );
        pointer-events:none;
      }

      .banner-label {
        position:absolute;
        bottom:18px;
        left:10px;
        right:10px;
        z-index:1;
        text-align:center;
        font-size:clamp(10px,1.4vw,18px);
        font-weight:bold;
        letter-spacing:2px;
        text-shadow:0 2px 8px #0008;
      }

      .banner-label small {
        display:block;
        font-size:9px;
        letter-spacing:1px;
        margin-top:7px;
      }

      .banner.active {
        outline:4px solid #fff;
        outline-offset:-4px;
      }

      .banner.active:before {
        content:"";
        position:absolute;
        top:0;
        left:0;
        right:0;
        height:5px;
        background:#fff;
        z-index:2;
      }

      /* ====================================
         全体レイアウト
      ==================================== */
      .layout {
        display:grid;
        grid-template-columns:
          225px minmax(0,1fr);
        align-items:start;
      }

      .sidebar {
        background:#fafafa;
        border-right:1px solid #ddd;
        height:calc(100vh - 76px);
        overflow-y:scroll;
        padding:32px 19px;
        position:sticky;
        top:0;
      }

      .sidebar-title {
        font-size:12px;
        letter-spacing:2px;
        font-weight:bold;
        margin:0 0 20px;
      }

      .category {
        display:block;
        width:100%;
        text-align:left;
        border:0;
        background:none;
        padding:13px 7px;
        border-left:3px solid transparent;
        font-size:13px;
        color:#666;
      }

      .category.active {
        border-left-color:#222;
        color:#222;
        background:#ececec;
        font-weight:bold;
      }

      .catalog-menu {
        margin-top:25px;
        padding-top:20px;
        border-top:1px solid #ddd;
      }

      .menu-path {
        margin-bottom:10px;
        font-size:11px;
        font-weight:bold;
        letter-spacing:.6px;
        color:#777;
      }

      .menu-items {
        display:grid;
        gap:4px;
        max-height:260px;
        overflow:auto;
        scrollbar-gutter:stable;
      }

      .menu-item,
      .menu-back {
        display:flex;
        align-items:center;
        gap:7px;
        width:100%;
        padding:8px 7px;
        border:0;
        border-left:3px solid transparent;
        background:transparent;
        color:#666;
        text-align:left;
        font-size:11px;
        opacity:0;
        transform:translateX(-8px);
        animation:menuItemEnter .72s cubic-bezier(.16,1,.3,1) both;
        animation-delay:calc(70ms + (var(--menu-index,0) * 45ms));
      }

      .menu-item:hover,
      .menu-item.active,
      .menu-back:hover {
        border-left-color:#222;
        background:#ececec;
        color:#222;
      }

      .menu-back {
        color:inherit;
        opacity:1;
        transform:none;
        animation:none;
        margin-bottom:5px;
      }

      .menu-swatch {
        width:12px;
        height:12px;
        border-radius:50%;
        flex:0 0 12px;
      }

      @keyframes menuItemEnter {
        from { opacity:0; transform:translateX(-8px); }
        to { opacity:1; transform:translateX(0); }
      }

      .filter-section {
        margin-top:30px;
        padding-top:25px;
        border-top:1px solid #ddd;
      }

      .filter-section label {
        display:block;
        font-size:12px;
        margin:15px 0 8px;
      }

      .filter-section select {
        width:100%;
        padding:11px;
        background:#fff;
        border:1px solid #ccc;
      }

      .side-note {
        font-size:10px;
        line-height:2;
        color:#999;
        margin-top:40px;
      }

.stage {
        min-width:0;
        height:100%;
        overflow-y:auto;
        overflow-x:hidden;
        scrollbar-gutter:stable;
      }

      .world {
        animation:worldIn .45s ease both;
      }

      @keyframes worldIn {
        from {
          opacity:0;
          transform:translateY(12px);
        }
        to {
          opacity:1;
          transform:translateY(0);
        }
      }

      /* ====================================
         共通商品カード
      ==================================== */
      .catalog {
        padding:55px 5%;
        min-height:350px;
        overflow-anchor:none;
      }

      .catalog-back {
        display:inline-flex;
        align-items:center;
        margin:0 0 10px;
        padding:9px 0;
        border:0;
        border-bottom:1px solid currentColor;
        background:transparent;
        color:inherit;
        font-size:13px;
        font-weight:bold;
      }

      .catalog-current-item {
        margin:0 0 22px;
        font-size:12px;
        letter-spacing:1.4px;
        opacity:.7;
      }

      .catalog-leave-forward,
      .catalog-leave-back {
        pointer-events:none;
      }

      .catalog-leave-forward > * {
        animation:catalogLeaveForward .7s cubic-bezier(.45,0,.2,1) both;
      }

      .catalog-leave-back > * {
        animation:catalogLeaveBack .7s cubic-bezier(.45,0,.2,1) both;
      }

      .catalog-layers {
        position:relative;
        isolation:isolate;
      }

      .catalog-incoming {
        position:relative;
        z-index:1;
      }

      .catalog-outgoing {
        position:absolute;
        inset:0;
        z-index:0;
        width:100%;
        pointer-events:none;
      }

      .catalog-enter-forward .catalog-outgoing {
        animation:catalogOutgoingForward .5s cubic-bezier(.4,0,.2,1) both;
      }

      .catalog-enter-forward,
      .catalog-enter-back {
        overflow:visible;
      }

      .catalog-enter-back .catalog-outgoing {
        animation:catalogOutgoingBack .5s cubic-bezier(.4,0,.2,1) both;
      }

      .catalog-enter-forward .catalog-incoming > :not(.product-grid),
      .catalog-enter-back .catalog-incoming > :not(.product-grid) {
        animation:catalogTitleEnter .7s cubic-bezier(.16,1,.3,1) both;
      }

      .catalog-enter-forward .catalog-incoming .product-card,
      .catalog-enter-back .catalog-incoming .product-card {
        animation:catalogCardEnter .8s cubic-bezier(.16,1,.3,1) both;
        animation-delay:calc(180ms + (var(--catalog-card-index,0) * 180ms));
      }

      .catalog-enter-back .catalog-incoming .product-card {
        animation-name:catalogCardEnterBack;
      }

      .product-card.is-selected {
        transform:scale(1.025);
        box-shadow:0 12px 28px #0002;
      }

      @keyframes catalogLeaveForward {
        to { opacity:0; transform:translateX(-24px); }
      }

      @keyframes catalogLeaveBack {
        to { opacity:0; transform:translateX(24px); }
      }

      @keyframes catalogOutgoingForward {
        from { opacity:.16; transform:translateX(-10px); }
        to { opacity:0; transform:translateX(-28px); }
      }

      @keyframes catalogOutgoingBack {
        from { opacity:.16; transform:translateX(10px); }
        to { opacity:0; transform:translateX(28px); }
      }

      @keyframes catalogTitleEnter {
        from { opacity:0; transform:translateY(16px); }
        to { opacity:1; transform:translateY(0); }
      }

      @keyframes catalogCardEnter {
        from { opacity:0; transform:translateY(20px); }
        to { opacity:1; transform:translateY(0); }
      }

      @keyframes catalogCardEnterBack {
        from { opacity:0; transform:translateX(-20px) translateY(12px); }
        to { opacity:1; transform:translateX(0) translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .catalog-menu *, .catalog *, .product-card {
          animation:none !important;
          transition:none !important;
        }
      }

      .product-grid {
        display:grid;
        grid-template-columns:
          repeat(4,minmax(0,1fr));
        gap:22px;
        margin-top:30px;
      }

      .product-card {
        border:0;
        padding:0;
        background:#fff;
        text-align:left;
        min-width:0;
        width:100%;
        transition:
          transform .25s,
          box-shadow .25s;
      }

      .product-card:hover {
        transform:translateY(-5px);
        box-shadow:0 10px 25px #0002;
      }

      .product-photo { overflow:hidden; }

      .product-photo img {
        display:block;
        width:100%;
        transition:transform .35s;
      }

      .product-card:hover img {
        transform:scale(1.045);
      }

      .product-text { padding:17px; }

      .product-text small {
        font-size:10px;
        letter-spacing:1px;
      }

      .product-text h3 {
        font-size:16px;
        font-weight:500;
        margin:10px 0;
      }

      .product-text p { font-size:14px; }

      .product-text span {
        font-size:10px;
        letter-spacing:1px;
      }

      .empty { grid-column:1/-1; }

      /* ====================================
         商品詳細・カート共通モーダル
      ==================================== */
      .overlay {
        position:fixed;
        inset:0;
        z-index:99999;
        background:#000a;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:15px;
      }

      .overlay.modal-opening { animation:modalBackdropIn 1.35s cubic-bezier(.16,1,.3,1) both; }
      .overlay.modal-opening .modal { animation:modalExpandIn 1.35s cubic-bezier(.16,1,.3,1) both; transform-origin:center center; will-change:transform,opacity; }
      .overlay.modal-opening #modalBody { animation:modalContentsIn .8s cubic-bezier(.16,1,.3,1) .35s both; }
      .overlay.modal-closing { animation:modalBackdropOut .62s cubic-bezier(.7,0,.84,0) both; }
      .overlay.modal-closing .modal { animation:modalShrinkOut .62s cubic-bezier(.7,0,.84,0) both; transform-origin:center center; will-change:transform,opacity; }
      @keyframes modalBackdropIn { from { opacity:0; background:rgba(0,0,0,0); } to { opacity:1; background:#000a; } }
      @keyframes modalExpandIn { from { opacity:0; transform:scale(.65); } to { opacity:1; transform:scale(1); } }
      @keyframes modalContentsIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
      @keyframes modalBackdropOut { from { opacity:1; background:#000a; } to { opacity:0; background:rgba(0,0,0,0); } }
      @keyframes modalShrinkOut { from { opacity:1; transform:scale(1); } to { opacity:0; transform:scale(.65); } }

      .modal {
        position:relative;
        width:min(940px,100%);
        max-height:92vh;
        overflow:auto;
        background:white;
        color:#222;
        padding:30px;
        font-family:Arial,"Noto Sans JP",sans-serif;
      }

      .modal-close {
        position:absolute;
        right:13px;
        top:10px;
        border:0;
        background:none;
        font-size:32px;
        z-index:2;
      }

      .detail-image-frame .detail-image { width:100%; height:100%; }

        .layout {

  // ========================================
  // メインイベント
  // ========================================
  bindEvents() {
    const root=this.shadowRoot;

    // ブランド切り替え
    root.querySelectorAll(
      "[data-brand]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        if(this.catalogIsTransitioning) return;
        this.current=btn.dataset.brand;
        this.category="すべて";
        this.filterColor="すべて";
        this.filterSize="すべて";
        this.catalogLevel="items";
        this.selectedItemId=null;
        this.menuOpen=false;
        this.render();
      };
    });

    // カテゴリ選択
    root.querySelectorAll(
      "[data-category]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        if(this.catalogIsTransitioning) return;
        this.category=btn.dataset.category;
        this.render();
      };
    });

    // アイテムクリック：カラー一覧へ切り替え
    root.querySelectorAll(
      "[data-item]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        this.transitionCatalog(
          "colors",btn.dataset.item,btn
        );
      };
    });

    // カラー別商品クリック：詳細モーダルを開く
    root.querySelectorAll(
      "[data-product]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        this.openProduct(
          btn.dataset.product,
          Number(btn.dataset.colorIndex)
        );
      };
    });

    const catalogBack=root.getElementById("catalogBack");
    const menuBacks=root.querySelectorAll("[data-catalog-menu-back]");
    [catalogBack,...menuBacks].filter(Boolean).forEach(back=>{
      back.onclick=()=>{
        this.transitionCatalog("items",null,back);
      };
    });

    // カラー絞り込み
    root.getElementById(
      "filterColor"
    ).onchange=e=>{
      if(this.catalogIsTransitioning) return;
      this.filterColor=e.target.value;
      this.render();
    };

    // サイズ絞り込み
    root.getElementById(
      "filterSize"
    ).onchange=e=>{
      if(this.catalogIsTransitioning) return;
      this.filterSize=e.target.value;
      this.render();
    };

    // スマホメニュー
    root.getElementById(
      "menuToggle"
    ).onclick=()=>{
      this.menuOpen=!this.menuOpen;
      root.getElementById(
        "sidebar"
      ).classList.toggle(
        "show",this.menuOpen
      );
    };

    // カート表示
    root.getElementById(
      "cartButton"
    ).onclick=()=>this.openCart();

    root.getElementById("sideCartOverlay").onclick=e=>{
      if(e.target.id==="sideCartOverlay") this.closeCart();
    };

    // モーダルを閉じる
    root.getElementById(
      "closeModal"
    ).onclick=()=>this.closeModal();

    root.getElementById(
      "overlay"
    ).onclick=e=>{
      if(e.target.id==="overlay") {
        this.closeModal();
      }
    };
  }

  // ========================================
  // モーダル管理
  // ========================================
  openModal(html) {
    const overlay=this.shadowRoot.getElementById("overlay");
    const modalBody=this.shadowRoot.getElementById("modalBody");
    if(this.modalAnimationTimer) window.clearTimeout(this.modalAnimationTimer);
    modalBody.innerHTML=html;
    overlay.hidden=false;
    overlay.classList.remove("modal-closing","modal-opening");
    void overlay.offsetWidth;
    overlay.classList.add("modal-opening");
    this.modalOpen=true;
    this.modalAnimationTimer=window.setTimeout(()=>{
      overlay.classList.remove("modal-opening");
      this.modalAnimationTimer=null;
    },1450);
  }

  closeModal() {
    const overlay=this.shadowRoot.getElementById("overlay");
    if(!overlay || overlay.hidden) return;
    if(this.modalAnimationTimer) window.clearTimeout(this.modalAnimationTimer);
    overlay.classList.remove("modal-opening");
    void overlay.offsetWidth;
    overlay.classList.add("modal-closing");
    this.modalOpen=false;
    this.modalAnimationTimer=window.setTimeout(()=>{
      overlay.classList.remove("modal-closing");
      overlay.hidden=true;
      this.modalAnimationTimer=null;
    },650);
  }

  // ========================================
  // 商品詳細を開く
  // ========================================
  openProduct(id,colorIndex=0) {
    this.activeProduct=this.products.find(
      p=>p.id===id
    );

    if(!this.activeProduct) return;

    this.selectedColor=Number.isInteger(colorIndex) &&
      colorIndex>=0 &&
      colorIndex<this.activeProduct.colors.length
        ?colorIndex:0;
    this.selectedSize=this.detailSizes(this.activeProduct).find(size=>
      this.detailStock(this.activeProduct,this.selectedColor,size)>0
    );
    this.quantity=1;

    // 初期表示は購入モード
    this.detailTab="buy";

    this.renderDetail();
  }

  validQty(value,max=99) {
    return Math.max(
      1,
      Math.min(
        99,
        Math.floor(Number(value)||1)
      )
    );
  }

  detailSizes(p) {
    return p.sizes.some(s=>/^[A-Za-z]+$/.test(s))
      ?p.sizes
      :["21.5","22.0","22.5","23.0","23.5","24.0","24.5","25.0"]
        .filter(s=>p.sizes.includes(s));
  }

  detailStock(p,colorIndex,size) {
    const index=this.detailSizes(p).indexOf(size);
    return (index+colorIndex)%5===0 ?0:((index+colorIndex)%3)+1;
  }

  // ========================================
  // 商品詳細モーダル
  // 購入・商品説明切り替え
  // ========================================
  renderDetail() {
    const p=this.activeProduct;
    const brand=this.brands.find(
      b=>b.id===p.brand
    );

    const activeTab=this.detailTab;

    const detailAlreadyOpen=
      this.modalOpen &&
      !!this.shadowRoot.querySelector("#modalBody .detail-grid");

    const detailHtml=`
      <div class="detail-grid">

        <!-- 左側：画像・カラーサムネイル・在庫 -->
        <div class="detail-left-panel">
          <div class="detail-image-frame"><img id="detailImage" class="detail-image" src="${this.shoe(p.colors[this.selectedColor],p.shape)}" alt="${p.name}"></div>
          <div class="detail-color-thumbnails">
            ${p.colors.map((c,i)=>`
              <button class="detail-color-thumb ${i===this.selectedColor?"active":""}" data-color="${i}" type="button">
                <img src="${this.shoe(c,p.shape)}" alt=""><small>${c}</small>
              </button>
            `).join("")}
          </div>
          <div class="detail-inventory"><div class="detail-section-label">サイズ別在庫（模擬）</div><div class="detail-size-table">
            ${this.detailSizes(p).map(size=>{const stock=this.detailStock(p,this.selectedColor,size);return `<button class="detail-size-cell ${size===this.selectedSize?"selected":""} ${stock?"":"sold-out"}" data-size-choice="${size}" ${stock?"":"disabled"} type="button"><strong>${size}</strong><small>${stock?"あり":"なし"}</small></button>`;}).join("")}
          </div></div>
          <!-- 購入モード -->
          <div id="purchasePanel">
            <div class="detail-purchase-group">
              <div class="purchase-field purchase-size"><label for="detailSize">サイズ</label><select id="detailSize">${this.detailSizes(p).filter(s=>this.detailStock(p,this.selectedColor,s)>0).map(s=>`<option value="${s}" ${s===this.selectedSize?"selected":""}>${s}</option>`).join("")}</select></div>
              <div class="purchase-field purchase-quantity"><label for="detailQty">数量</label><div class="detail-quantity"><input type="number" id="detailQty" min="1" max="${this.detailStock(p,this.selectedColor,this.selectedSize)||1}" value="${this.quantity}"><button type="button" data-qty-step="1">▲</button><button type="button" data-qty-step="-1">▼</button></div></div>
              <button class="detail-add" id="addCart" type="button">追加</button><button class="detail-cart-view" id="detailCartButton" type="button">🛒 カートを見る (${this.cart.reduce((sum,item)=>sum+item.qty,0)})</button>
            </div>
          </div>
        </div>
        <!-- 商品情報 -->
        <div class="detail-info">
          <small>
            ${brand.name} / NO. ${p.id}
          </small>

          <h2>${p.name}</h2>

          <div class="detail-price">
            ${this.money(p.price)}
          </div>

          <!-- 商品説明モード -->
          <div id="descriptionPanel"
            >

            <div class="description-content">

              <div class="description-brand">
                ${brand.name}
              </div>

              <h3>${p.name}</h3>
              <p>${p.description}</p>

              <h4>商品の特徴</h4>
              <p>${brand.description}</p>

              <h4>カラー展開</h4>
              <p>${p.colors.join(" / ")}</p>

              <h4>サイズ展開</h4>
              <p>${p.sizes.join(" / ")} cm</p>

              <h4>素材</h4>
              <p>${p.material}</p>

              <h4>原産国</h4>
              <p>${p.origin}</p>

              <h4>お手入れ方法</h4>
              <p>${p.care}</p>

              <h4>商品番号</h4>
              <p>${p.id}</p>

              <div class="description-note">
                ※現在は模擬商品情報です。
              </div>
            </div>
          </div>

        </div>
      </div>
    `;

    if(detailAlreadyOpen) {
      this.shadowRoot.getElementById("modalBody").innerHTML=detailHtml;
    } else {
      this.openModal(detailHtml);
    }

    const root=this.shadowRoot;

    root.querySelectorAll(
      "[data-color]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        this.selectedSize=root.getElementById(
          "detailSize"
        ).value;

        this.quantity=this.validQty(
        root.getElementById("detailQty").value,
        this.detailStock(this.activeProduct,this.selectedColor,this.selectedSize)
      );

        this.selectedColor=Number(
          btn.dataset.color
        );

        if(!this.detailStock(this.activeProduct,this.selectedColor,this.selectedSize)) {
          this.selectedSize=this.detailSizes(this.activeProduct).find(size=>
            this.detailStock(this.activeProduct,this.selectedColor,size)>0
          );
          this.quantity=1;
        } else {
          this.quantity=this.validQty(this.quantity,this.detailStock(
            this.activeProduct,this.selectedColor,this.selectedSize
          ));
        }

        this.renderDetail();
      };
    });

    root.querySelectorAll("[data-size-choice]").forEach(btn=>{ btn.onclick=()=>{ this.selectedSize=btn.dataset.sizeChoice; this.quantity=1; this.renderDetail(); }; });
    root.getElementById("detailSize").onchange=e=>{ this.selectedSize=e.target.value; this.quantity=1; this.renderDetail(); };
    root.querySelectorAll("[data-qty-step]").forEach(btn=>{ btn.onclick=()=>{ const stock=this.detailStock(this.activeProduct,this.selectedColor,this.selectedSize); this.quantity=Math.max(1,Math.min(stock,this.quantity+Number(btn.dataset.qtyStep))); root.getElementById("detailQty").value=this.quantity; }; });
    root.getElementById("detailCartButton").onclick=()=>this.openCart();

    // カートへ追加
    root.getElementById(
      "addCart"
    ).onclick=()=>{
      this.selectedSize=root.getElementById(
        "detailSize"
      ).value;

      this.quantity=this.validQty(
        root.getElementById("detailQty").value,
        this.detailStock(this.activeProduct,this.selectedColor,this.selectedSize)
      );

      this.addToCart();
    };
  }

  // ========================================
  // カート追加
  // ========================================
  addToCart() {
    const p=this.activeProduct;

    const item={
      id:p.id,
      brand:p.brand,
      name:p.name,
      price:p.price,
      color:p.colors[this.selectedColor],
      size:this.selectedSize,
      qty:this.quantity
    };

    const existing=this.cart.find(x=>
      x.id===item.id &&
      x.color===item.color &&
      x.size===item.size
    );

    if(existing) {
      existing.qty+=item.qty;
    } else {
      this.cart.push(item);
    }

    this.refreshCartCount();
  }

  // ========================================
  // カート表示
  // ========================================
  refreshCartCount() {
    const count=this.cart.reduce((sum,item)=>sum+item.qty,0);
    const root=this.shadowRoot;
    const headerCart=root.getElementById("cartButton");
    const detailCart=root.getElementById("detailCartButton");
    if(headerCart) headerCart.textContent=`CART (${count})`;
    if(detailCart) detailCart.textContent=`🛒 カートを見る (${count})`;
  }
  cartTotal() { return this.cart.reduce((sum,item)=>sum+item.price*item.qty,0); }
  closeCart() { const o=this.shadowRoot.getElementById("sideCartOverlay"); if(!o||o.hidden)return; o.classList.remove("is-open"); this.sideCartOpen=false; window.setTimeout(()=>{if(!this.sideCartOpen)o.hidden=true;},350); }
  openCart() {
    const o=this.shadowRoot.getElementById("sideCartOverlay"), panel=this.shadowRoot.getElementById("sideCart"); if(!o||!panel)return;
    panel.innerHTML=`<header class="side-cart-header"><h2>SHOPPING CART</h2><button id="closeCart" type="button">×</button></header><div class="side-cart-items">${this.cart.map((item,i)=>{const product=this.products.find(p=>p.id===item.id);return `<article class="side-cart-line"><img src="${product?this.shoe(item.color,product.shape):""}" alt="${item.name}"><div><strong>${item.name}</strong><small>${item.color} / ${item.size} cm</small><small>単価 ${this.money(item.price)}</small><div class="side-cart-actions"><button data-qty="-1" data-index="${i}" type="button">−</button><span>${item.qty}</span><button data-qty="1" data-index="${i}" type="button">＋</button><button class="remove" data-remove="${i}" type="button">削除</button></div></div><strong>${this.money(item.price*item.qty)}</strong></article>`;}).join("")||'<p class="side-cart-empty">カートは空です。</p>'}</div><footer class="side-cart-footer"><div>合計 <strong>${this.money(this.cartTotal())}</strong></div><button class="primary" id="checkout" type="button">購入手続きへ</button></footer>`;
    o.hidden=false; void o.offsetWidth; o.classList.add("is-open"); this.sideCartOpen=true;
    panel.querySelector("#closeCart").onclick=()=>this.closeCart();
    panel.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{this.cart.splice(Number(b.dataset.remove),1);this.refreshCartCount();this.openCart();});
    panel.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{const item=this.cart[Number(b.dataset.index)];if(!item)return;item.qty=Math.max(1,item.qty+Number(b.dataset.qty));this.refreshCartCount();this.openCart();});
    panel.querySelector("#checkout").onclick=()=>alert("購入手続きへ進む機能はデモです。");
  }
}
// ==========================================
// カスタム要素登録
// ==========================================
customElements.define(
  "hd-brand-shop",
  HdBrandShop
);

</script>
</body>
</html>
